services:
  postgres:
    image: postgres:15-alpine
    container_name: hub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-hub_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-hub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: hub-ml
    ports:
      - "9000:9000"
    volumes:
      - ./ml-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload

  hub-backend:
    build:
      context: ./hub/backend
      dockerfile: Dockerfile
    container_name: hub-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-hub_db}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./hub/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============ Subsystem A — ระบบหอพัก (Week 6) ============
  postgres-dorm:
    image: postgres:15-alpine
    container_name: hub-postgres-dorm
    environment:
      POSTGRES_USER: ${DORM_POSTGRES_USER:-dorm}
      POSTGRES_PASSWORD: ${DORM_POSTGRES_PASSWORD:-dormpass}
      POSTGRES_DB: ${DORM_POSTGRES_DB:-dorm_db}
    ports:
      - "5433:5432"   # 5432 ใช้กับ Hub Postgres แล้ว
    volumes:
      - postgres_dorm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DORM_POSTGRES_USER:-dorm} -d ${DORM_POSTGRES_DB:-dorm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  subsystem-dorm:
    build:
      context: ./hub/subsystem-dorm
      dockerfile: Dockerfile
    container_name: hub-subsystem-dorm
    env_file:
      - ./hub/subsystem-dorm/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${DORM_POSTGRES_USER:-dorm}:${DORM_POSTGRES_PASSWORD:-dormpass}@postgres-dorm:5432/${DORM_POSTGRES_DB:-dorm_db}
    ports:
      - "8001:8000"
    depends_on:
      postgres-dorm:
        condition: service_healthy
      hub-backend:
        condition: service_started
    volumes:
      - ./hub/subsystem-dorm:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============ Subsystem B — ระบบห้องสมุด (Week 7) ============
  postgres-library:
    image: postgres:15-alpine
    container_name: hub-postgres-library
    environment:
      POSTGRES_USER: ${LIBRARY_POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${LIBRARY_POSTGRES_PASSWORD:-librarypass}
      POSTGRES_DB: ${LIBRARY_POSTGRES_DB:-library_db}
    ports:
      - "5434:5432"   # 5432 Hub, 5433 Dorm, 5434 Library
    volumes:
      - postgres_library_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LIBRARY_POSTGRES_USER:-library} -d ${LIBRARY_POSTGRES_DB:-library_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  subsystem-library:
    build:
      context: ./hub/subsystem-library
      dockerfile: Dockerfile
    container_name: hub-subsystem-library
    env_file:
      - ./hub/subsystem-library/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${LIBRARY_POSTGRES_USER:-library}:${LIBRARY_POSTGRES_PASSWORD:-librarypass}@postgres-library:5432/${LIBRARY_POSTGRES_DB:-library_db}
    ports:
      - "8002:8000"
    depends_on:
      postgres-library:
        condition: service_healthy
      hub-backend:
        condition: service_started
    volumes:
      - ./hub/subsystem-library:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============ Hub Admin Frontend — Next.js (Week 8) ============
  hub-frontend:
    build:
      context: ./hub/frontend
      dockerfile: Dockerfile
    container_name: hub-frontend
    environment:
      NEXT_PUBLIC_HUB_URL: ${NEXT_PUBLIC_HUB_URL:-http://localhost:8000}
      HUB_INTERNAL_URL: http://hub-backend:8000
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3000:3000"
    depends_on:
      hub-backend:
        condition: service_started
    volumes:
      - ./hub/frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  postgres_dorm_data:
  postgres_library_data:
