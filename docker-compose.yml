# Hub Auth Platform stack — Hub backend + ML Verifier + Admin Frontend + shared infra (PG, Redis)
#
# This file is the *Auth Platform* — owned/operated by the central IT team.
# Each subsystem (Dorm, Library, …) lives in its own docker-compose.<slug>.yml
# and runs as a separate stack that connects via the shared `cah-net` external
# network. Why: the subsystems are independent OAuth clients in production
# (deployed by different teams, possibly on different servers). The split here
# mirrors that reality so the dev/prod gap stays small.
#
# Start:    bash scripts/stack/up.sh hub
# Or:       docker compose up -d
# Stop:     docker compose down       (keeps DB volumes — drop with -v to wipe)
#
# Network:  `cah-net` is declared external — bootstrap via scripts/stack/net.sh
#           (auto-created by scripts/stack/up.sh on first run).

name: cah-hub

services:
  postgres:
    image: postgres:15-alpine
    container_name: hub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-hub_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-hub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: hub-ml
    ports:
      - "9000:9000"
    volumes:
      - ./ml-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload

  hub-backend:
    build:
      context: ./hub/backend
      dockerfile: Dockerfile
    container_name: hub-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-hub_db}
      REDIS_URL: redis://redis:6379/0
    # Linux ต้อง map host.docker.internal เอง (Windows/Mac มี built-in อยู่แล้ว)
    # ใช้ตอน subsystem รันบน Windows host (XAMPP Apache port 80, Node dev server ฯลฯ)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./hub/backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============ Hub Admin Frontend — Next.js (Week 8) ============
  hub-frontend:
    build:
      context: ./hub/frontend
      dockerfile: Dockerfile
    container_name: hub-frontend
    environment:
      NEXT_PUBLIC_HUB_URL: ${NEXT_PUBLIC_HUB_URL:-http://localhost:8000}
      HUB_INTERNAL_URL: http://hub-backend:8000
      NODE_ENV: ${NODE_ENV:-development}
      # Force polling watcher — แก้ปัญหา Next.js ไม่ detect file change
      # บน Windows + Docker mount (inotify ข้าม WSL/Hyper-V ไม่ทำงาน)
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      hub-backend:
        condition: service_started
    volumes:
      - ./hub/frontend:/app
      - /app/node_modules
      - /app/.next

# All services attach to the shared external network so subsystem stacks can
# resolve `hub-backend` by DNS. The network is bootstrapped by
# scripts/stack/up.sh (or by hand: `docker network create cah-net`).
networks:
  default:
    name: cah-net
    external: true

# Preserve existing data: pin volume names to what `central-auth-starter`
# stack already created. Without this, switching project to `cah-hub` would
# create empty volumes and the seeded users / login_sessions / audit_logs
# would appear lost.
volumes:
  postgres_data:
    name: central-auth-starter_postgres_data
    external: true
