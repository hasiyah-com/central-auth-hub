# Hub Auth Platform (Central IAM) — DOKPLOY deployment (DB แยกเป็น Dokploy resource)
# ─────────────────────────────────────────────────────────────────────────────
# Compose นี้มี "เฉพาะ app 3 ตัว": ml-service + hub-backend + hub-frontend
# ส่วน PostgreSQL + Redis = สร้างเป็น Dokploy Database resource แยกต่างหาก
# (Dokploy จัดการ backup/monitoring ให้ + data อยู่รอด redeploy ของ app)
#
# ── ทำไมแยก DB ──
#   - data durability: ลบ/redeploy compose app ไม่กระทบ DB
#   - Dokploy UI: backup อัตโนมัติ + ปุ่ม restore + metrics ต่อ DB
#
# ── ต่างจาก docker-compose.prod.yml (self-managed VPS + nginx + certbot) ──
#   - ❌ ตัด nginx + certbot → Dokploy มี Traefik ออก TLS (Let's Encrypt) + route domain
#   - ❌ ตัด postgres + redis → เป็น Dokploy Database resource (ดู §A ข้างล่าง)
#   - ❌ ไม่มี container_name / host ports → Dokploy จัดการ
#   - ❌ ไม่ใช้ env_file → ตั้ง env ใน Dokploy UI (Environment) inject ให้ทุก service
#
# ═══ §A. สร้าง Database ก่อน deploy compose นี้ ═══════════════════════════════
# ใน Dokploy → project → Create Service → เลือก type Database:
#   1. PostgreSQL (v15) → ตั้ง user/password/db → หลังสร้างจะได้ "Internal Host"
#      เช่น  s6660506018db-postgres-xxxx  (ใช้เป็น host ใน DATABASE_URL)
#   2. Redis (v7) → ได้ Internal Host เช่น  s6660506018db-redis-xxxx
#   * ทั้งคู่อยู่บน network "dokploy-network" → app ในไฟล์นี้เข้าถึงได้ (ดู networks ล่าง)
#
# ═══ §B. Environment ที่ต้องตั้งใน Dokploy (ของ compose service นี้) ═══════════
#   DATABASE_URL=postgresql+psycopg2://<user>:<pass>@<pg-internal-host>:5432/<db>
#   REDIS_URL=redis://<redis-internal-host>:6379/0
#   SECRET_KEY=...                  SECRET_ENCRYPTION_KEY=...   (prod: ห้าม default)
#   GOOGLE_CLIENT_ID=...            GOOGLE_CLIENT_SECRET=...
#   GOOGLE_REDIRECT_URI=https://hub.<domain>/auth/google/callback
#   GOOGLE_CHANGE_REDIRECT_URI=https://hub.<domain>/auth/account/change-google/callback
#   HUB_ISSUER=https://hub.<domain>     WEBHOOK_SHARED_KEY=...
#   APP_ENV=production  ENABLE_DOCS=false  ML_SHADOW_MODE=true
#   NEXT_PUBLIC_HUB_URL=https://hub.<domain>   (build arg ของ frontend)
#
# ═══ §C. Domains (ตั้งต่อ service ใน Dokploy → Traefik ออก TLS ให้) ════════════
#   hub-backend  → https://hub.<domain>    port 8000  (subsystem fetch JWKS/OAuth ที่นี่)
#   hub-frontend → https://admin.<domain>  port 3000  (admin console)
#   ml-service   = ไม่ตั้ง domain (internal)
#
# ═══ §D. หลัง deploy สำเร็จ — init ครั้งเดียว (Dokploy → Terminal ของ hub-backend) ═
#   python -m app.seeds.seed_users                                  # 100 users
#   (ml-service terminal) python -m scripts.generate_data && python -m scripts.train_model
#   * JWT keys + alembic migration = boot command ทำให้อัตโนมัติแล้ว (ไม่ต้องรันเอง)

services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ml_models:/app/models
      - ml_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 9000
    # internal only — hub-backend เรียกผ่าน http://ml-service:9000 (default network)

  hub-backend:
    build:
      context: ./hub/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # โดเมนตั้งใน Dokploy UI → port 8000 (public: subsystem fetch JWKS/OAuth ที่นี่)
    expose:
      - "8000"
    # ⚠️ Dokploy inject env เข้า container "เฉพาะตัวที่ list ที่นี่" (ผ่าน ${VAR} interpolation)
    # ตั้งค่าใน Dokploy UI → Environment แล้วมันจะเติมให้ · ที่ไม่ list = ไม่ถึง container
    environment:
      # ── core ──
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?ตั้งใน Dokploy env}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?ตั้งใน Dokploy env (Fernet key)}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      # ── DB / cache / ML (internal) ──
      DATABASE_URL: ${DATABASE_URL:?ตั้งใน Dokploy env — ชี้ Postgres resource}
      REDIS_URL: ${REDIS_URL:?ตั้งใน Dokploy env — ชี้ Redis resource}
      ML_SERVICE_URL: http://ml-service:9000
      ML_SHADOW_MODE: ${ML_SHADOW_MODE:-true}
      # ── URLs / CORS ──
      HUB_BASE_URL: ${HUB_BASE_URL:-}
      HUB_ISSUER: ${HUB_ISSUER:-}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      # ── Google OAuth (ขาดตัวใดตัวหนึ่ง = login พัง "Missing client_id") ──
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?ตั้งใน Dokploy env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?ตั้งใน Dokploy env}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?ตั้งใน Dokploy env (https://<backend>/auth/google/callback)}
      OAUTH_CALLBACK_URI: ${OAUTH_CALLBACK_URI:-}
      GOOGLE_CHANGE_REDIRECT_URI: ${GOOGLE_CHANGE_REDIRECT_URI:-}
      # ── webhook (ให้ subsystem) ──
      WEBHOOK_SHARED_KEY: ${WEBHOOK_SHARED_KEY:-}
      # ── Passkey / WebAuthn (ตั้งเมื่อจะใช้ passkey บน prod — RP_ID = host ของ frontend) ──
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Central Auth Hub}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
    volumes:
      # JWT RSA keys — persist (regenerate = invalidate token ทุกใบ)
      - hub_jwt_keys:/app/keys
      # GeoIP DB (optional) — อัปโหลด GeoLite2-Country.mmdb เข้า volume นี้
      # ถ้าไม่มี → geo_country = NULL (ปกติสำหรับ dev/private IP, ไม่ใช่บั๊ก)
      - hub_data:/app/data
    networks:
      - default          # คุยกับ ml-service
      - dokploy-network  # เข้าถึง Postgres/Redis resource + ให้ Traefik route เข้ามา
    # Boot sequence (idempotent — ปลอดภัยรันทุกครั้งที่ container start):
    #   1. gen JWT keys ถ้ายังไม่มี (test -f กัน + < /dev/null กัน input() ค้าง)
    #      — จำเป็นเพราะ lifespan fail-fast ถ้าไม่มี key (volume ว่างตอน deploy แรก)
    #   2. alembic upgrade head — สร้าง/อัปเดต schema (ไม่มี create_all() ในโค้ด) no-op ถ้าล่าสุดแล้ว
    #   3. exec uvicorn — --proxy-headers อ่าน X-Forwarded-Proto/For จาก Dokploy proxy (B20)
    #      1 worker: lifespan มี background scheduler (api_guard/subsystem_health) — หลาย worker = รันซ้ำ
    command: >
      sh -c "test -f /app/keys/jwt_private.pem || python -m scripts.generate_jwt_keys < /dev/null;
             alembic upgrade head;
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

  hub-frontend:
    build:
      context: ./hub/frontend
      dockerfile: Dockerfile.prod
      args:
        # NEXT_PUBLIC_* ถูก inline ตอน build (client pages: login, passkey/recover)
        NEXT_PUBLIC_HUB_URL: ${NEXT_PUBLIC_HUB_URL:?ตั้งใน Dokploy env (https://hub.<domain>)}
    restart: unless-stopped
    # โดเมนตั้งใน Dokploy UI → port 3000 (admin console)
    expose:
      - "3000"
    environment:
      HUB_INTERNAL_URL: http://hub-backend:8000
      NODE_ENV: production
    networks:
      - default          # คุยกับ hub-backend
      - dokploy-network  # ให้ Traefik route เข้ามา
    depends_on:
      hub-backend:
        condition: service_started

networks:
  default:
  # network กลางของ Dokploy (Traefik + Database resource อยู่บนนี้) — สร้างโดย Dokploy แล้ว
  dokploy-network:
    external: true

volumes:
  hub_jwt_keys:
  hub_data:
  ml_models:
  ml_data:
