# Overlay: Caddy reverse proxy + Let's Encrypt HTTPS (Mode C — production)
#
# Use:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#
# Prereq:
#   1. แก้ Caddyfile — แทน <DOMAIN> ด้วย domain จริง
#   2. ชี้ DNS A record ของ hub./admin./dorm./library.<DOMAIN> → server IP
#   3. server เปิด port 80 + 443
#
# ความปลอดภัย — ต้องปิด host port ที่ bypass Caddy ได้
#   ไฟล์นี้เป็น overlay ทับ docker-compose.yml ซึ่ง publish host ports ไว้
#   (8000 hub-backend, 3000 frontend, 9000 ml, 5432 pg, 6379 redis) และ Compose
#   *append* list `ports:` → overlay ลบไม่ได้ (ดูหมายเหตุหัว docker-compose.prod.yml)
#   ⇒ ถ้าไม่ปิด attacker ยิง http://<server-ip>:8000 ตรงได้ พร้อมปลอม X-Real-IP
#     → ปลอมประเทศ / bypass IP blacklist / ปลอม audit log
#
#   เลือกทางใดทางหนึ่ง:
#   (A) แนะนำ — ใช้ docker-compose.prod.yml แทน (standalone, ไม่มี host ports, nginx+TLS)
#         docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#   (B) ถ้าจะใช้ Caddy overlay จริง — ปิด port ด้วย firewall ที่ OS:
#         sudo ufw default deny incoming && sudo ufw allow 22,80,443/tcp && sudo ufw enable
#         sudo ufw status                      # ยืนยันว่า 8000/3000/9000/5432/6379 ไม่เปิด
#       ตรวจซ้ำจากเครื่องนอก: curl -m 5 http://<server-ip>:8000/health  → ต้อง timeout/refused
services:
  caddy:
    image: caddy:2-alpine
    container_name: hub-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # Let's Encrypt certs + state (persist)
      - caddy_config:/config     # Caddy auto-managed config
    depends_on:
      - hub-backend
      - hub-frontend
      - subsystem-dorm
      - subsystem-library

volumes:
  caddy_data:
  caddy_config:
