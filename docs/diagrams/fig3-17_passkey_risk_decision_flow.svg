<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 780" width="940" height="780" font-family="'Sarabun','TH Sarabun New','Tahoma','Segoe UI','Noto Sans Thai',sans-serif"><rect x="0" y="0" width="940" height="780" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker><marker id="arwl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/></marker><marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker><marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker></defs><text x="470.0" y="30" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">รูปที่ 3.17  Passkey และการตัดสินใจตามความเสี่ยง (Passkey + Risk Decision Flow)</text><rect x="320" y="55" width="300" height="50" rx="10" fill="#E6F6FE" stroke="#0EA5E9" stroke-width="1.6"/><text x="470" y="77" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">ผลรวมคะแนนความเสี่ยงจาก Hybrid RBA</text><text x="470" y="95" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">(รายละเอียดในรูปที่ 3.14)</text><line x1="470" y1="105" x2="470" y2="130" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><polygon points="470,127 590,165 470,203 350,165" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="470" y="162" font-size="10" fill="#1E293B" text-anchor="middle" font-weight="700">ระดับความเสี่ยง</text><text x="470" y="177" font-size="10" fill="#1E293B" text-anchor="middle" font-weight="700">รวม (0.0–1.0)</text><rect x="60" y="240" width="220" height="60" rx="10" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="170" y="264" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">allow  (risk &lt; 0.50)</text><text x="170" y="283" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">เข้าสู่ระบบสำเร็จ → ออก JWT</text><path d="M380,190 L170,240" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwg)"/><rect x="350" y="240" width="240" height="60" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="1.6"/><text x="470" y="264" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">mfa  (0.50–0.84)</text><text x="470" y="283" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">ต้องยืนยันตัวตนเพิ่ม (step-up)</text><line x1="470" y1="203" x2="470" y2="240" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="660" y="240" width="220" height="60" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.6"/><text x="770" y="264" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">block  (risk ≥ 0.85)</text><text x="770" y="283" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">ปฏิเสธทันที (hard block)</text><path d="M560,190 L770,240" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwr)"/><line x1="770" y1="300" x2="770" y2="330" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwr)"/><rect x="630" y="332" width="280" height="56" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.6"/><text x="770" y="355" font-size="10.8" fill="#1E293B" text-anchor="middle" font-weight="700">ปฏิเสธทันที — ไม่ผ่าน step-up</text><text x="770" y="374" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">บันทึก audit log (risk_hard_block)</text><line x1="470" y1="300" x2="470" y2="330" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="320" y="332" width="300" height="56" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="1.6"/><text x="470" y="353" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="700">risk_challenge.mint()</text><text x="470" y="371" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">Redis one-time token (atomic, TTL) — B9</text><line x1="470" y1="388" x2="470" y2="412" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="280" y="414" width="380" height="46" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="470" y="442" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="700">redirect → /auth/passkey/risk-stepup</text><line x1="470" y1="460" x2="470" y2="484" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><polygon points="470,478 600,518 470,558 340,518" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="470" y="522" font-size="10.5" fill="#1E293B" text-anchor="middle" font-weight="700">ผู้ใช้เลือกวิธียืนยัน</text><rect x="180" y="590" width="260" height="76" rx="10" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="310" y="615" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">Passkey (WebAuthn)</text><text x="310" y="634" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="400">challenge → biometric/PIN → เซ็น →</text><text x="310" y="650" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="400">verify signature + sign_count</text><path d="M400,558 L310,590" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwl)"/><rect x="500" y="590" width="260" height="76" rx="10" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="630" y="615" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">Email OTP (fallback)</text><text x="630" y="634" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="400">/auth/stepup/otp/* — กรณีอุปกรณ์ไม่รองรับ</text><text x="630" y="650" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="400">Passkey → เข้าสู่โหมด Recovery</text><path d="M540,558 L630,590" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwl)"/><path d="M310,666 C 310,700 470,700 470,700" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwl)"/><path d="M630,666 C 630,700 470,700 470,700" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwl)"/><rect x="320" y="702" width="300" height="60" rx="10" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="470" y="726" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">ยืนยันสำเร็จ</text><text x="470" y="745" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">consume risk token (one-time) → ออก JWT</text><text x="770" y="460" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="400">ตรวจ sign_count ย้อนกลับ</text><text x="770" y="475" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="400">→ สัญญาณ credential ถูก clone</text></svg>