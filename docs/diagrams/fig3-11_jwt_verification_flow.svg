<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="'Sarabun','TH Sarabun New','Tahoma','Segoe UI','Noto Sans Thai',sans-serif"><rect x="0" y="0" width="900" height="640" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker><marker id="arwl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/></marker><marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker><marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker></defs><text x="450.0" y="30" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">รูปที่ 3.11  กระบวนการตรวจสอบ JWT (JWT Verification Flow)</text><rect x="330" y="50" width="240" height="76" rx="10" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="450" y="75" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="700">Hub ออก JWT</text><text x="450" y="95" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">RS256, header kid = active key id</text><text x="450" y="112" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="400">claims: sub, aud, iat, exp, jti, ...</text><line x1="450" y1="126" x2="450" y2="150" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="150" y="152" width="260" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="280" y="176" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">ส่ง token กลับระบบย่อย</text><text x="280" y="195" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">(auth_code exchange — รูปที่ 3.10)</text><rect x="490" y="152" width="260" height="60" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="1.6"/><text x="620" y="176" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">บันทึก jti ใน LoginSession</text><text x="620" y="195" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">(ใช้ force-revoke ภายหลัง)</text><line x1="450" y1="126" x2="280" y2="150" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><line x1="450" y1="126" x2="620" y2="150" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><line x1="280" y1="212" x2="280" y2="236" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="150" y="238" width="260" height="70" rx="10" fill="#EEF0FF" stroke="#6366F1" stroke-width="1.6"/><text x="280" y="262" font-size="10.8" fill="#1E293B" text-anchor="middle" font-weight="700">ระบบย่อย: GET /.well-known/jwks.json</text><text x="280" y="280" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="400">cache 10 นาที (JWKS = public key เท่านั้น)</text><text x="280" y="297" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="400">match key ด้วย kid ใน header</text><line x1="280" y1="308" x2="280" y2="332" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="150" y="334" width="260" height="80" rx="10" fill="#EEF0FF" stroke="#6366F1" stroke-width="1.6"/><text x="280" y="358" font-size="10.3" fill="#1E293B" text-anchor="middle" font-weight="700">pyjwt.decode(token, public_key,</text><text x="280" y="375" font-size="10.3" fill="#1E293B" text-anchor="middle" font-weight="700">audience=client_id,</text><text x="280" y="392" font-size="10.3" fill="#1E293B" text-anchor="middle" font-weight="700">verify_aud/iss/exp = True)</text><text x="280" y="407" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="400">ป้องกัน audience confusion (B4)</text><line x1="620" y1="212" x2="620" y2="332" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="490" y="334" width="260" height="90" rx="10" fill="#E6F6FE" stroke="#0EA5E9" stroke-width="1.6"/><text x="620" y="358" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="700">Hub: is_revoked(jti)?</text><text x="620" y="376" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">ตรวจ Redis jti blacklist</text><text x="620" y="393" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">(TTL = remaining exp)</text><text x="620" y="410" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">+ OIDC token introspection</text><line x1="280" y1="414" x2="280" y2="438" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><polygon points="280,432 400,470 280,508 160,470" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="280" y="467" font-size="10" fill="#1E293B" text-anchor="middle" font-weight="700">signature + claims</text><text x="280" y="482" font-size="10" fill="#1E293B" text-anchor="middle" font-weight="700">ถูกต้องทั้งหมด?</text><rect x="80" y="540" width="220" height="60" rx="10" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="190" y="565" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">ผ่าน</text><text x="190" y="584" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">สร้าง session cookie ของระบบย่อย</text><rect x="340" y="540" width="220" height="60" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.6"/><text x="450" y="565" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">ไม่ผ่าน</text><text x="450" y="584" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">401 — ปฏิเสธ ไม่สร้าง session</text><path d="M220,505 L190,540" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwg)"/><path d="M340,505 L450,540" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwr)"/></svg>