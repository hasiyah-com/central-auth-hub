<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="'Sarabun','TH Sarabun New','Tahoma','Segoe UI','Noto Sans Thai',sans-serif"><rect x="0" y="0" width="1000" height="700" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker><marker id="arwl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/></marker><marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker><marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker></defs><text x="500.0" y="30" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">รูปที่ 3.1  สถาปัตยกรรมระบบภาพรวม (System Architecture Overview)</text><rect x="60" y="55" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/><text x="155" y="80" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="700">User</text><text x="155" y="99" font-size="10" fill="#64748B" text-anchor="middle" font-weight="400">นักศึกษา / อาจารย์ / เจ้าหน้าที่</text><rect x="750" y="55" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/><text x="845" y="80" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="700">Admin</text><text x="845" y="99" font-size="10" fill="#64748B" text-anchor="middle" font-weight="400">ผู้ดูแลระบบ (Hub Admin)</text><rect x="60" y="155" width="190" height="66" rx="10" fill="#FDECEA" stroke="#EA4335" stroke-width="1.6"/><text x="155" y="180" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">Google OAuth</text><text x="155" y="199" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">OAuth 2.0 / OIDC (IdP)</text><text x="155" y="213" font-size="9" fill="#94A3B8" text-anchor="middle" font-weight="400">«external»</text><rect x="750" y="155" width="190" height="66" rx="10" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="845" y="180" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">Passkey</text><text x="845" y="199" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">WebAuthn / FIDO2</text><text x="845" y="213" font-size="8.8" fill="#94A3B8" text-anchor="middle" font-weight="400">private key อยู่บนอุปกรณ์ผู้ใช้</text><rect x="350" y="165" width="300" height="110" rx="14" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="500.0" y="195" font-size="16" fill="#1E293B" text-anchor="middle" font-weight="700">Hub</text><text x="500.0" y="215" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">Central Auth Server (FastAPI :8000)</text><text x="500.0" y="233" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">OAuth2/OIDC · Hybrid RBA · Audit</text><text x="500.0" y="251" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">JWT Issuer (RS256) · JWKS</text><line x1="155" y1="111" x2="155" y2="155" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><path d="M155,221 C155,260 340,260 380,255" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><text x="200" y="250" font-size="9.5" fill="#1E293B" text-anchor="start" font-weight="400">① login</text><line x1="845" y1="111" x2="845" y2="155" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><path d="M845,221 C845,260 660,260 620,255" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><text x="760" y="250" font-size="9.5" fill="#1E293B" text-anchor="start" font-weight="400">② จัดการระบบ</text><line x1="250" y1="188" x2="350" y2="188" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><text x="260" y="178" font-size="9" fill="#64748B" text-anchor="start" font-weight="400">federated auth</text><line x1="650" y1="188" x2="750" y2="188" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><text x="660" y="178" font-size="9" fill="#64748B" text-anchor="start" font-weight="400">WebAuthn ceremony</text><rect x="250" y="330" width="160" height="74" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="330" y="355" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">Database</text><text x="330" y="373" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">PostgreSQL</text><text x="330" y="390" font-size="9" fill="#64748B" text-anchor="middle" font-weight="400">hub_db (14 ตาราง)</text><rect x="430" y="330" width="160" height="74" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.6"/><text x="510" y="355" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">Redis</text><text x="510" y="373" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">Cache / Session</text><text x="510" y="390" font-size="9" fill="#64748B" text-anchor="middle" font-weight="400">OAuth state · jti blacklist</text><rect x="610" y="330" width="160" height="74" rx="10" fill="#E6F6FE" stroke="#0EA5E9" stroke-width="1.6"/><text x="690" y="355" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">ML Service</text><text x="690" y="373" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">Isolation Forest</text><text x="690" y="390" font-size="9" fill="#64748B" text-anchor="middle" font-weight="400">+ SHAP TreeExplainer :9000</text><line x1="410" y1="275" x2="330" y2="330" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><line x1="500.0" y1="275" x2="510" y2="330" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><line x1="590" y1="275" x2="690" y2="330" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="120" y="470" width="340" height="110" rx="14" fill="#EEF0FF" stroke="#6366F1" stroke-width="1.6"/><text x="290" y="498" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="700">Subsystem A — ระบบหอพัก</text><text x="290" y="518" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">subsystem-dorm :8001</text><text x="290" y="536" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">OAuth Client + PKCE · session แยกอิสระ</text><text x="290" y="554" font-size="9.5" fill="#64748B" text-anchor="middle" font-weight="400">postgres-dorm (dorm_db)</text><rect x="540" y="470" width="340" height="110" rx="14" fill="#E7F8F1" stroke="#10B981" stroke-width="1.6"/><text x="710" y="498" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="700">Subsystem B — ระบบห้องสมุด</text><text x="710" y="518" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">subsystem-library :8002</text><text x="710" y="536" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">OAuth Client + PKCE · session แยกอิสระ</text><text x="710" y="554" font-size="9.5" fill="#64748B" text-anchor="middle" font-weight="400">postgres-library (library_db)</text><path d="M440,440 C 440,430 300,440 290,470" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><text x="330" y="440" font-size="9.3" fill="#1E293B" text-anchor="start" font-weight="400">③ ออก JWT (aud=client_id)</text><path d="M290,470 C 310,440 490,430 490,440" stroke="#475569" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arwl)"/><path d="M560,440 C 560,430 700,440 710,470" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><path d="M710,470 C 730,440 610,430 610,440" stroke="#475569" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arwl)"/><text x="570" y="440" font-size="9.3" fill="#1E293B" text-anchor="start" font-weight="400">ตรวจผ่าน JWKS</text><line x1="200" y1="111" x2="260" y2="468" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwl)"/><text x="230" y="300" font-size="9" fill="#64748B" text-anchor="start" font-weight="400">ใช้งานฟีเจอร์ธุรกิจ</text><text x="230" y="314" font-size="9" fill="#64748B" text-anchor="start" font-weight="400">(จองห้อง / ยืมหนังสือ)</text><text x="500.0" y="620" font-size="11.5" fill="#DC2626" text-anchor="middle" font-weight="700">หมายเหตุ: สถาปัตยกรรมไม่ใช่ SSO — แต่ละระบบย่อยมี session ของตนเองแยกจากกัน</text><text x="500.0" y="638" font-size="10.5" fill="#64748B" text-anchor="middle" font-weight="400">Hub ทำหน้าที่ authenticate + authorize เท่านั้น ไม่ carry session ข้ามระบบ</text><text x="500.0" y="662" font-size="10" fill="#64748B" text-anchor="middle" font-weight="400">ทุกระบบย่อยที่ลงทะเบียนกับ Hub ใช้รูปแบบเดียวกันนี้ (ปัจจุบันมี 2 ระบบ: หอพัก และ ห้องสมุด)</text></svg>