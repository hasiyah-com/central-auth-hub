<path d="M386,306 L386,270 L500,270 L500,258" stroke="#0f9d8f" stroke-width="1.3" stroke-dasharray="4 2" fill="none" marker-end="url(#ar3)"/>
<path d="M566,306 L566,270 L530,270 L530,258" stroke="#0f9d8f" stroke-width="1.3" stroke-dasharray="4 2" fill="none" marker-end="url(#ar3)"/>

<!-- ===== Google OAuth / Passkey external (dashed box below cah-net) ===== -->
<rect x="340" y="408" width="356" height="50" rx="8" fill="#fff" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="4 2"/>
<circle cx="372" cy="433" r="11" fill="none" stroke="#4285F4" stroke-width="2.5"/>
<path d="M372,433 L383,433" stroke="#4285F4" stroke-width="2.5"/>
<text x="398" y="427" font-size="10" font-weight="700" fill="#555">«external» Google OAuth</text>
<text x="398" y="441" font-size="9" fill="#888">hub-backend เชื่อมผ่าน HTTPS (OIDC discovery)</text>
<text x="398" y="452" font-size="8.5" fill="#aaa">Passkey (WebAuthn) ยืนยันบน browser โดยตรง ไม่ผ่าน server</text>
<!-- arrow: hub-backend → Google -->
<path d="M512,258 L512,400" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#ar)"/>

<!-- ===== Legend ===== -->
<rect x="10" y="468" width="700" height="82" rx="8" fill="#fff" stroke="#cccccc"/>
<text x="24" y="486" font-size="10.5" font-weight="700" fill="#1a1a1a">คำอธิบาย (Legend):</text>
