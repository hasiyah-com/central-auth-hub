<text x="644" y="336" text-anchor="middle" font-size="8.5" fill="#555">library_db</text>
<text x="644" y="347" text-anchor="middle" font-size="8" fill="#888">:5434</text>

<!-- ===== arrows: Nginx → services ===== -->
<!-- admin. → hub-frontend -->
<path d="M310,123 Q330,123 352,143" stroke="#3a4250" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<!-- auth. → hub-backend -->
<path d="M310,143 Q340,143 462,143" stroke="#3a4250" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<!-- dorm. → subsystem-dorm -->
<path d="M310,165 Q328,165 328,330 L340,330" stroke="#3a4250" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
