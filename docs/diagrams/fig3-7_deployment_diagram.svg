<path d="M310,183 Q326,183 326,350 L520,350" stroke="#3a4250" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

<!-- ===== internal arrows (dashed blue) ===== -->
<!-- frontend → backend -->
<line x1="452" y1="143" x2="462" y2="143" stroke="#2f6feb" stroke-width="1.3" stroke-dasharray="4 2" marker-end="url(#ar2)"/>
<!-- backend → ml -->
<line x1="562" y1="143" x2="572" y2="143" stroke="#2f6feb" stroke-width="1.3" stroke-dasharray="4 2" marker-end="url(#ar2)"/>
<!-- backend → postgres -->
<path d="M490,168 L450,178" stroke="#2f6feb" stroke-width="1.3" stroke-dasharray="4 2" fill="none" marker-end="url(#ar2)"/>
