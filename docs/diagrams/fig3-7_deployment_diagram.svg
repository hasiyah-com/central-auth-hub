<text x="40" y="502" font-size="9.5" fill="#555">cah-hub (Hub Auth + ML + Admin Console)</text>
<rect x="236" y="494" width="12" height="8" rx="2" fill="#DDF3F0" stroke="#0f9d8f"/>
<text x="252" y="502" font-size="9.5" fill="#555">cah-dorm / cah-library (ระบบย่อย)</text>
<rect x="444" y="494" width="12" height="8" rx="2" fill="#FFF8E8" stroke="#C77F12"/>
<text x="460" y="502" font-size="9.5" fill="#555">Nginx (public gateway, TLS terminate)</text>
<line x1="24" y1="516" x2="54" y2="516" stroke="#3a4250" stroke-width="1.8"/>
<text x="58" y="520" font-size="9.5" fill="#555">HTTPS route (public, per subdomain)</text>
<line x1="236" y1="516" x2="266" y2="516" stroke="#2f6feb" stroke-width="1.3" stroke-dasharray="4 2"/>
<text x="270" y="520" font-size="9.5" fill="#555">Internal call (cah-net, HTTP)</text>
<line x1="444" y1="516" x2="474" y2="516" stroke="#0f9d8f" stroke-width="1.3" stroke-dasharray="4 2"/>
<text x="478" y="520" font-size="9.5" fill="#555">Subsystem → Hub (JWKS verify)</text>
<text x="24" y="542" font-size="9" fill="#888">⚠ port ภายใน (8000–9000, 5432–5434, 6379) ไม่ expose ออก public — เปิดให้เฉพาะ Nginx ผ่าน cah-net · volume hub_jwt_keys เก็บ RSA key ไม่ regenerate เมื่อ redeploy</text>
</svg>
