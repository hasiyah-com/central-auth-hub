<svg width="720" height="560" viewBox="0 0 720 560" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Segoe UI','Sarabun',sans-serif">
<title>รูปที่ 3.7 แผนภาพการติดตั้งระบบ (Deployment Diagram — VM + Docker)</title>
<desc>การติดตั้งระบบบน VPS เดียว: Nginx รับ HTTPS แล้ว route ตาม subdomain เข้า 3 Docker stacks (cah-hub, cah-dorm, cah-library) ผ่าน internal network cah-net</desc>
<defs>
  <marker id="ar"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3a4250"/></marker>
  <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2f6feb"/></marker>
  <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0f9d8f"/></marker>
</defs>
<rect width="720" height="560" fill="#f8f9fa"/>

<!-- Title -->
<text x="360" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">รูปที่ 3.7  แผนภาพการติดตั้งระบบ (Deployment Diagram — VM + Docker)</text>
<text x="360" y="44" text-anchor="middle" font-size="10.5" fill="#666">Single VPS · Docker Compose · Nginx Reverse Proxy · Let's Encrypt TLS</text>

<!-- ===== INTERNET ===== -->
