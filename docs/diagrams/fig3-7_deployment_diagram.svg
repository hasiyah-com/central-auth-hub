<text x="60" y="114" text-anchor="middle" font-size="9" fill="#666">HTTPS (443)</text>

<!-- arrow: Internet → Nginx -->
<line x1="110" y1="91" x2="158" y2="91" stroke="#3a4250" stroke-width="2" marker-end="url(#ar)"/>

<!-- ===== NGINX box ===== -->
<rect x="160" y="62" width="150" height="162" rx="10" fill="#FFF8E8" stroke="#C77F12" stroke-width="2"/>
<text x="235" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4d06">Nginx</text>
<text x="235" y="99" text-anchor="middle" font-size="9.5" fill="#7a4d06">Reverse Proxy + TLS</text>
<line x1="168" y1="106" x2="302" y2="106" stroke="#C77F12" stroke-width="1"/>
<rect x="172" y="112" width="130" height="18" rx="4" fill="#FFF0CC" stroke="#e0a020"/>
<text x="237" y="124" text-anchor="middle" font-size="9.5" fill="#7a4d06">admin.example.com</text>
<rect x="172" y="134" width="130" height="18" rx="4" fill="#FFF0CC" stroke="#e0a020"/>
<text x="237" y="146" text-anchor="middle" font-size="9.5" fill="#7a4d06">auth.example.com</text>
<rect x="172" y="156" width="130" height="18" rx="4" fill="#FFF0CC" stroke="#e0a020"/>
<text x="237" y="168" text-anchor="middle" font-size="9.5" fill="#7a4d06">dorm.example.com</text>
<rect x="172" y="178" width="130" height="18" rx="4" fill="#FFF0CC" stroke="#e0a020"/>
<text x="237" y="190" text-anchor="middle" font-size="9.5" fill="#7a4d06">library.example.com</text>
<text x="235" y="216" text-anchor="middle" font-size="8.5" fill="#888">🔒 Let's Encrypt (certbot)</text>

<!-- ===== cah-net boundary ===== -->
<rect x="328" y="58" width="382" height="386" rx="12" fill="rgba(47,111,235,0.04)" stroke="#2f6feb" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="340" y="77" font-size="10" font-weight="700" fill="#2f6feb">Docker network: cah-net (internal — no public ports)</text>

