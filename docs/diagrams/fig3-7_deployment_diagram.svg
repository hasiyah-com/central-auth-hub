<text x="512" y="161" text-anchor="middle" font-size="8.5" fill="#888">Auth · RBAC · JWT</text>

<!-- ml-service -->
<rect x="572" y="118" width="100" height="50" rx="6" fill="#fff" stroke="#2f6feb" stroke-width="1.5"/>
<text x="622" y="136" text-anchor="middle" font-size="10" font-weight="600" fill="#0C447C">ml-service</text>
