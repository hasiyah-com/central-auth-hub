<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="'Sarabun','TH Sarabun New','Tahoma','Segoe UI','Noto Sans Thai',sans-serif"><rect x="0" y="0" width="920" height="600" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker><marker id="arwl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/></marker><marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker><marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker></defs><text x="460.0" y="30" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">รูปที่ 3.2  สถาปัตยกรรมเชิงธุรกิจ (Business Architecture)</text><rect x="60" y="70" width="360" height="200" rx="14" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="240.0" y="100" font-size="14.5" fill="#1E293B" text-anchor="middle" font-weight="700">1. Identity &amp; Onboarding</text><text x="240.0" y="120" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">(การลงทะเบียนตัวตน)</text><text x="240.0" y="148" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="400">ผู้รับผิดชอบ: อาจารย์ / เจ้าหน้าที่ / ผู้ดูแลระบบ</text><text x="240.0" y="170" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="400">ลงทะเบียน subsystem เป็น OAuth client</text><text x="240.0" y="192" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="400">ผู้ใช้ยืนยันตัวตนผ่าน Google / Passkey</text><rect x="480" y="70" width="360" height="200" rx="14" fill="#FEF3E2" stroke="#D97706" stroke-width="1.6"/><text x="660.0" y="100" font-size="14.5" fill="#1E293B" text-anchor="middle" font-weight="700">2. Access Governance</text><text x="660.0" y="120" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">(การกำกับดูแลสิทธิ์)</text><text x="660.0" y="148" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="400">ผู้รับผิดชอบ: ผู้ดูแลระบบ (Hub Admin)</text><text x="660.0" y="170" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="400">อนุมัติ/ปฏิเสธ subsystem ที่ลงทะเบียน</text><text x="660.0" y="192" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="400">จัดการ whitelist (access_list) และเพิกถอนสิทธิ์</text><rect x="480" y="320" width="360" height="200" rx="14" fill="#E6F6FE" stroke="#0EA5E9" stroke-width="1.6"/><text x="660.0" y="350" font-size="14.5" fill="#1E293B" text-anchor="middle" font-weight="700">3. Risk &amp; Trust Management</text><text x="660.0" y="370" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">(การบริหารความเสี่ยง)</text><text x="660.0" y="398" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="400">ผู้รับผิดชอบ: ระบบอัตโนมัติ (Hybrid RBA)</text><text x="660.0" y="420" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="400">ประเมินความเสี่ยงทุกครั้งที่ล็อกอิน</text><text x="660.0" y="442" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="400">ตัดสิน allow / warn / challenge / block + step-up MFA</text><rect x="60" y="320" width="360" height="200" rx="14" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="240.0" y="350" font-size="14.5" fill="#1E293B" text-anchor="middle" font-weight="700">4. Business Ops &amp; Compliance</text><text x="240.0" y="370" font-size="11" fill="#475569" text-anchor="middle" font-weight="400">(การดำเนินธุรกิจและตรวจสอบ)</text><text x="240.0" y="398" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="400">ผู้รับผิดชอบ: นักศึกษา / อาจารย์ / เจ้าหน้าที่</text><text x="240.0" y="420" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="400">จองห้องพัก (หอพัก) · ยืม-คืนหนังสือ (ห้องสมุด)</text><text x="240.0" y="442" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="400">บันทึก audit log แบบ append-only ทุก state change</text><line x1="420" y1="170.0" x2="480" y2="170.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/><line x1="660.0" y1="270" x2="660.0" y2="320" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/><line x1="480" y1="420.0" x2="420" y2="420.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/><path d="M60+100.0,520 L60,520 L60,270 L60+170.0,270" stroke="#475569" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arwl)"/><text x="30" y="300" font-size="10" fill="#64748B" text-anchor="start" font-weight="400">ป้อนกลับ (feedback loop): audit + risk log ใช้ปรับปรุงนโยบายและ whitelist</text><text x="460.0" y="555" font-size="10.5" fill="#64748B" text-anchor="middle" font-weight="400">เส้นทึบ = ลำดับกระบวนการหลัก (1→2→3→4)   ·   เส้นประ = ข้อมูลป้อนกลับปรับปรุงนโยบาย</text></svg>