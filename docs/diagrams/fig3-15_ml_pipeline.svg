<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" width="960" height="820" font-family="'Sarabun','TH Sarabun New','Tahoma','Segoe UI','Noto Sans Thai',sans-serif"><rect x="0" y="0" width="960" height="820" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker><marker id="arwl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/></marker><marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker><marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker></defs><text x="480.0" y="30" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">รูปที่ 3.15  ขั้นตอนการพัฒนาโมเดล Machine Learning (Machine Learning Pipeline)</text><rect x="140" y="55" width="620" height="76" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="450.0" y="79" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">1. Synthetic Data Generation</text><text x="450.0" y="97" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">ml-service/scripts/generate_data.py (random.seed=42)</text><text x="450.0" y="113" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">6 รูปแบบ anomaly จำลอง: night, foreign, burst, new_device, failed_spike, passkey_takeover</text><text x="900" y="75" font-size="9.5" fill="#94A3B8" text-anchor="end" font-weight="400">sessions.csv</text><line x1="450" y1="131" x2="450" y2="151" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="140" y="151" width="620" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="450.0" y="175" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">2. Preprocessing</text><text x="450.0" y="193" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">ลบข้อมูลซ้ำ · จัดการค่าขาดหาย (geo_country) · แปลงข้อความเป็นตัวเลข</text><line x1="450" y1="211" x2="450" y2="231" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="140" y="231" width="620" height="60" rx="10" fill="#EEF0FF" stroke="#6366F1" stroke-width="1.6"/><text x="450.0" y="255" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">3. Feature Engineering</text><text x="450.0" y="273" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">สร้าง 23 features / 12 หมวด — รูปที่ 3.16 (เช่น hours_from_typical_login_time)</text><line x1="450" y1="291" x2="450" y2="311" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="140" y="311" width="620" height="60" rx="10" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="450.0" y="335" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">4. Train — Isolation Forest</text><text x="450.0" y="353" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">ml-service/scripts/train_model.py (scikit-learn) → บันทึก iforest_v1.pkl</text><line x1="450" y1="371" x2="450" y2="391" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="140" y="391" width="620" height="60" rx="10" fill="#E6F6FE" stroke="#0EA5E9" stroke-width="1.6"/><text x="450.0" y="415" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">5. Evaluate</text><text x="450.0" y="433" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">ROC-AUC · classification report · confusion matrix — ผลล่าสุด AUC-ROC = 0.9946</text><line x1="450" y1="451" x2="450" y2="471" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="140" y="471" width="620" height="60" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="1.6"/><text x="450.0" y="495" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">6. Explain — SHAP TreeExplainer</text><text x="450.0" y="513" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">คำนวณ per-feature contribution ต่อ anomaly score ของแต่ละ session</text><line x1="450" y1="531" x2="450" y2="551" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="140" y="551" width="620" height="60" rx="10" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="450.0" y="575" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">7. Serve</text><text x="450.0" y="593" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">ml-service โหลด iforest_v1.pkl → POST /v1/score (เรียกจาก Hub, fail-safe → 0.0)</text><path d="M760,581 C 830,581 830,300 830,300 C 830,77 760,77 760,77" stroke="#475569" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arwl)"/><text x="845" y="343.0" font-size="9" fill="#64748B" text-anchor="start" font-weight="400">Retrain เมื่อ feature</text><text x="845" y="358.0" font-size="9" fill="#64748B" text-anchor="start" font-weight="400">เปลี่ยน / มีข้อมูลจริงสะสม</text></svg>