<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" font-family="'Sarabun','TH Sarabun New','Tahoma','Segoe UI','Noto Sans Thai',sans-serif"><rect x="0" y="0" width="1000" height="900" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker><marker id="arwl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/></marker><marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker><marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker></defs><text x="500.0" y="30" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">รูปที่ 3.18  การตรวจจับและตอบสนองต่อเหตุการณ์ความเสี่ยง (Risk Detection &amp; Incident Response Flow)</text><text x="120" y="55" font-size="12.5" fill="#4F46E5" text-anchor="start" font-weight="700">เฟส 1 — ตรวจจับและบันทึก (Detection)</text><rect x="120" y="73" width="760" height="86" rx="10" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="500.0" y="97" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">①  ทุกครั้งที่ login</text><text x="500.0" y="116" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">Hybrid RBA ให้คะแนน (รูปที่ 3.14) → บันทึก risk_score, decision, risk_breakdown (รวม SHAP) ลง login_sessions</text><text x="500.0" y="132" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">เหตุการณ์ที่เกี่ยวข้อง (ip, geo, device) ถูกบันทึกใน audit_logs คู่กันตามช่วงเวลา ±10/+30 นาที</text><text x="920" y="93" font-size="9" fill="#94A3B8" text-anchor="end" font-weight="400">ไม่มีตาราง</text><text x="920" y="107" font-size="9" fill="#94A3B8" text-anchor="end" font-weight="400">incident แยก</text><line x1="500" y1="159" x2="500" y2="179" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><text x="120" y="179" font-size="12.5" fill="#4F46E5" text-anchor="start" font-weight="700">เฟส 2 — คัดกรองและสร้างรายงาน (Triage)</text><rect x="120" y="197" width="760" height="69" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="1.6"/><text x="500.0" y="221" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">②  GET /admin/incidents — คัดกรอง</text><text x="500.0" y="240" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">session ที่ decision ∈ {block, would_block, challenge, would_challenge, mfa, would_mfa} หรือ is_attack_ip = True</text><line x1="500" y1="266" x2="500" y2="286" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="120" y="286" width="760" height="120" rx="10" fill="#E6F6FE" stroke="#0EA5E9" stroke-width="1.6"/><text x="500.0" y="310" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">③  GET /admin/incidents/{id} — ประกอบรายงานแบบ derive สด</text><text x="500.0" y="329" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">severity: risk_score ≥0.85 critical / ≥0.70 high / ≥0.50 medium / else low</text><text x="500.0" y="345" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">incident id: INC-{YYYY-MM-DD}-{ลำดับที่ของ user วันนั้น}</text><text x="500.0" y="361" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">สรุปเหตุการณ์: WHY จาก risk_reasons/SHAP อันดับ 1 · WHAT จาก decision (เช่น challenge → "บังคับยืนยันตัวตน") · WHAT TO DO จาก playbook</text><text x="500.0" y="377" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">เส้นทางการโจมตี (Attack Path): Internet(ip/geo) → ช่องทางเข้า (เช่น GET /auth/google/callback) → Central Auth Hub (4-Layer RBA) → เป้าหมาย → ผลลัพธ์</text><line x1="500" y1="406" x2="500" y2="426" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><text x="120" y="426" font-size="12.5" fill="#4F46E5" text-anchor="start" font-weight="700">เฟส 3 — ตอบสนอง (Remediation, ต้องผ่าน step-up)</text><rect x="120" y="444" width="760" height="50" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="1.6"/><text x="500" y="466" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">④ ผู้ดูแลระบบเลือก action — POST /admin/incidents/{id}/action</text><text x="500" y="484" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="400">Depends(step-up gate "incident_action") — ต้องยืนยันตัวตนซ้ำก่อนทำ</text><rect x="120" y="514" width="190" height="64" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.4"/><text x="215" y="540" font-size="10.8" fill="#1E293B" text-anchor="middle" font-weight="700">revoke_session</text><text x="215" y="560" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">jwt_service.revoke_jti() + set logout_at</text><line x1="500" y1="508" x2="215" y2="514" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="330" y="514" width="190" height="64" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.4"/><text x="425" y="540" font-size="10.8" fill="#1E293B" text-anchor="middle" font-weight="700">block_ip</text><text x="425" y="560" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">ip_blacklist.add_to_blacklist()</text><line x1="500" y1="508" x2="425" y2="514" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="540" y="514" width="190" height="64" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="1.4"/><text x="635" y="540" font-size="10.8" fill="#1E293B" text-anchor="middle" font-weight="700">reset_passkey</text><text x="635" y="560" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">passkey_recovery.admin_reset_passkeys()</text><line x1="500" y1="508" x2="635" y2="514" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="750" y="514" width="190" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/><text x="845" y="540" font-size="10.8" fill="#1E293B" text-anchor="middle" font-weight="700">notify_user</text><text x="845" y="560" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="400">email_service.send_revoke_notification()</text><line x1="500" y1="508" x2="845" y2="514" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="120" y="602" width="760" height="50" rx="10" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="500" y="624" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="700">⑤ audit_service.log_action() — บันทึก incident_action_{action}</text><text x="500" y="642" font-size="9.3" fill="#475569" text-anchor="middle" font-weight="400">ทุก action ที่ทำถูกบันทึกย้อนกลับเข้า audit_logs — ใช้สร้าง timeline ของ incident ถัดไปได้อีก</text></svg>