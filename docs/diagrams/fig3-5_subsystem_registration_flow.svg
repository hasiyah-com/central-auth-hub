<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 840" width="920" height="840" font-family="'Sarabun','TH Sarabun New','Tahoma','Segoe UI','Noto Sans Thai',sans-serif"><rect x="0" y="0" width="920" height="840" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker><marker id="arwl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/></marker><marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker><marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker></defs><text x="460.0" y="30" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">รูปที่ 3.5  กระบวนการลงทะเบียนระบบย่อย (Subsystem Registration Flow)</text><rect x="110" y="55" width="700" height="74" rx="10" fill="#EEF0FF" stroke="#6366F1" stroke-width="1.6"/><text x="460.0" y="79" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">①  นักพัฒนา submit คำขอลงทะเบียนระบบย่อย</text><text x="460.0" y="99" font-size="10.3" fill="#475569" text-anchor="middle" font-weight="400">POST /developer/subsystems — Depends(require_developer) + step-up gate (ต้องผ่าน MFA)</text><line x1="460" y1="129" x2="460" y2="151" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="110" y="151" width="700" height="74" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="460.0" y="175" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">②  Hub ตรวจสอบคำขอ</text><text x="460.0" y="195" font-size="10.3" fill="#475569" text-anchor="middle" font-weight="400">validate scope ∈ ALLOWED_SCOPES · validate access_policy + policy_config</text><line x1="460" y1="225" x2="460" y2="247" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="110" y="247" width="700" height="92" rx="10" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="460.0" y="271" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">③  สร้าง credentials</text><text x="460.0" y="291" font-size="10.3" fill="#475569" text-anchor="middle" font-weight="400">client_id / client_secret (hash เก็บ DB, Argon2id)</text><text x="460.0" y="309" font-size="10.3" fill="#475569" text-anchor="middle" font-weight="400">roster api_key (อ่านอย่างเดียว) — Argon2 hash + prefix 12 ตัวแรก</text><line x1="460" y1="339" x2="460" y2="361" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="110" y="361" width="700" height="92" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="1.6"/><text x="460.0" y="385" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">④  บันทึกลงฐานข้อมูล</text><text x="460.0" y="405" font-size="10.3" fill="#475569" text-anchor="middle" font-weight="400">subsystems (status = pending) + secret_retrieval_tokens</text><text x="460.0" y="423" font-size="10.3" fill="#475569" text-anchor="middle" font-weight="400">(token = HMAC เท่านั้น, secret เข้ารหัส Fernet, TTL 15 นาที)</text><line x1="460" y1="453" x2="460" y2="475" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="110" y="475" width="700" height="74" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="460.0" y="499" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">⑤  ตอบกลับนักพัฒนา</text><text x="460.0" y="519" font-size="10.3" fill="#475569" text-anchor="middle" font-weight="400">audit log (subsystem_registered) + secret_retrieval_url (ดู client_secret ได้ครั้งเดียว)</text><polygon points="460,577 590,619 460,661 330,619" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="460" y="616" font-size="10" fill="#1E293B" text-anchor="middle" font-weight="700">ผู้ดูแลระบบ</text><text x="460" y="631" font-size="10" fill="#1E293B" text-anchor="middle" font-weight="700">ตรวจสอบคำขอ</text><rect x="150" y="679" width="260" height="60" rx="10" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="280" y="704" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">⑥a อนุมัติ (approve)</text><text x="280" y="723" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">status = active</text><rect x="510" y="679" width="260" height="60" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.6"/><text x="640" y="704" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">⑥b ปฏิเสธ (reject)</text><text x="640" y="723" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">status = rejected + audit log</text><path d="M410,641 L280,679" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwg)"/><path d="M510,641 L640,679" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwr)"/><rect x="110" y="769" width="700" height="76" rx="10" fill="#E6F6FE" stroke="#0EA5E9" stroke-width="1.6"/><text x="460" y="795" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">⑦ Runtime — เมื่อ subsystem active แล้ว</text><text x="460" y="815" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">ผู้ใช้ login ผ่าน OAuth (client_id/secret) — รูปที่ 3.10</text><text x="460" y="833" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">subsystem ดึงรายชื่อผู้ใช้ล่วงหน้าผ่าน GET /api/v1/roster (X-Api-Key) — รูปที่ 3.6</text><line x1="280" y1="739" x2="280" y2="769" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/></svg>