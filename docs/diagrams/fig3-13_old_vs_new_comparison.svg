<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="'Sarabun','TH Sarabun New','Tahoma','Segoe UI','Noto Sans Thai',sans-serif"><rect x="0" y="0" width="1000" height="760" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker><marker id="arwl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/></marker><marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker><marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker></defs><text x="500.0" y="30" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">รูปที่ 3.13  วิวัฒนาการระบบประเมินความเสี่ยง (Old vs New Risk Scoring)</text><rect x="40" y="55" width="440" height="44" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="260" y="82" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="700">ระบบเดิม — Single ML Score (ก่อน Week 5)</text><rect x="520" y="55" width="440" height="44" rx="10" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="740" y="82" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="700">ระบบใหม่ — Hybrid RBA 4 ชั้น (ปัจจุบัน)</text><rect x="40" y="120" width="440" height="74" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="260" y="146" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">สกัด Feature 12 ตัว</text><text x="260" y="166" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">จาก session ปัจจุบัน</text><line x1="260" y1="194" x2="260" y2="212" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="40" y="212" width="440" height="74" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.6"/><text x="260" y="238" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">เรียก ml-service ครั้งเดียว</text><text x="260" y="258" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">POST /v1/score — Isolation Forest ล้วน</text><line x1="260" y1="286" x2="260" y2="304" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="40" y="304" width="440" height="74" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.6"/><text x="260" y="330" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">Threshold ตรงๆ บนคะแนนเดียว</text><text x="260" y="350" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">≥0.70 → block, ≥0.40 → mfa, else → pass</text><line x1="260" y1="378" x2="260" y2="396" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="40" y="396" width="440" height="74" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="260" y="422" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">IP blacklist แยกอิสระ</text><text x="260" y="442" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">ไม่ผูกกับคะแนนความเสี่ยง</text><rect x="40" y="488" width="440" height="60" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.6"/><text x="260" y="513" font-size="10.8" fill="#1E293B" text-anchor="middle" font-weight="700">black box — ไม่รู้ว่าทำไมถึงถูก block</text><text x="260" y="532" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="400">false positive สูง (ไม่มี calibration หลายชั้น)</text><rect x="520" y="120" width="440" height="74" rx="10" fill="#EEF0FF" stroke="#6366F1" stroke-width="1.6"/><text x="740" y="146" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">สกัด Feature 23 ตัว</text><text x="740" y="166" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">ขยายจาก 12 → 23 (รูปที่ 3.16)</text><line x1="740" y1="194" x2="740" y2="210" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="520" y="210" width="440" height="74" rx="10" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="740" y="236" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">Layer 1 — Rule Engine</text><text x="740" y="256" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">กฎตายตัว + hard block ทันที</text><line x1="740" y1="284" x2="740" y2="300" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="520" y="300" width="440" height="74" rx="10" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="740" y="326" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">Layer 2 — Behavior Profiling</text><text x="740" y="346" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">เทียบ baseline พฤติกรรม 30 วัน</text><line x1="740" y1="374" x2="740" y2="390" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="520" y="390" width="440" height="74" rx="10" fill="#E6F6FE" stroke="#0EA5E9" stroke-width="1.6"/><text x="740" y="416" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">Layer 3 — Isolation Forest</text><text x="740" y="436" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">เรียก ml-service (cap 0.4)</text><line x1="740" y1="464" x2="740" y2="480" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="520" y="480" width="440" height="74" rx="10" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="740" y="506" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">Layer 4 — Risk Aggregator</text><text x="740" y="526" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">รวมคะแนน + SHAP อธิบายได้ (รูปที่ 3.14)</text><rect x="520" y="570" width="440" height="60" rx="10" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="740" y="595" font-size="10.8" fill="#1E293B" text-anchor="middle" font-weight="700">explainable — SHAP + risk_reasons ต่อ session</text><text x="740" y="614" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="400">FPR ลดจาก 24% → 5.8% หลัง calibrate (หัวข้อ 3.8.4)</text><line x1="490" y1="55" x2="490" y2="705" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/><text x="500.0" y="730" font-size="10.5" fill="#1E293B" text-anchor="middle" font-weight="700">เหตุผลที่เปลี่ยน: single score ให้แค่ allow/mfa/block โดยไม่รู้สาเหตุ — Hybrid RBA เพิ่มชั้น</text><text x="500.0" y="748" font-size="10.5" fill="#1E293B" text-anchor="middle" font-weight="700">rule-based + behavior + explainability เพื่อลด false positive และให้ admin สืบสวนย้อนหลังได้ (รูปที่ 3.18)</text></svg>