<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="'Sarabun','TH Sarabun New','Tahoma','Segoe UI','Noto Sans Thai',sans-serif"><rect x="0" y="0" width="900" height="700" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker><marker id="arwl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/></marker><marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker><marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker></defs><text x="450.0" y="30" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">รูปที่ 3.9  กระบวนการยืนยันตัวตน (Authentication Flow)</text><rect x="350" y="55" width="200" height="44" rx="22" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/><text x="450" y="82" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">ผู้ใช้กด “เข้าสู่ระบบ” ที่ระบบย่อย</text><line x1="450" y1="99" x2="450" y2="130" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><polygon points="450,125 580,165 450,205 320,165" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="450" y="169" font-size="10.5" fill="#1E293B" text-anchor="middle" font-weight="700">เลือกวิธียืนยันตัวตน</text><rect x="170" y="235" width="180" height="60" rx="10" fill="#FDECEA" stroke="#EA4335" stroke-width="1.6"/><text x="260" y="260" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">Google OAuth</text><text x="260" y="279" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">OIDC discovery</text><path d="M450,205 L260,235" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwl)"/><rect x="550" y="235" width="180" height="60" rx="10" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="640" y="260" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">Passkey</text><text x="640" y="279" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">WebAuthn (FIDO2)</text><path d="M450,205 L640,235" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwl)"/><rect x="150" y="335" width="600" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="450" y="358" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">Hub ตรวจสอบตัวตนสำเร็จ</text><text x="450" y="377" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400">ตรวจ RBAC (user_type) + access_list (whitelist) — รูปที่ 3.6</text><path d="M260,295 L450,335" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwl)"/><path d="M640,295 L450,335" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwl)"/><line x1="450" y1="391" x2="450" y2="415" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="300" y="417" width="300" height="54" rx="10" fill="#E6F6FE" stroke="#0EA5E9" stroke-width="1.6"/><text x="450" y="439" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">Risk Engine — Hybrid RBA 4 ชั้น</text><text x="450" y="458" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">(รายละเอียดในรูปที่ 3.14)</text><line x1="450" y1="471" x2="450" y2="495" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><polygon points="450,492 560,530 450,568 340,530" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="450" y="527" font-size="10" fill="#1E293B" text-anchor="middle" font-weight="700">ผลการประเมิน</text><text x="450" y="542" font-size="10" fill="#1E293B" text-anchor="middle" font-weight="700">ความเสี่ยง</text><rect x="70" y="590" width="170" height="60" rx="10" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="155" y="615" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="700">อนุญาต (allow)</text><text x="155" y="634" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">ออก JWT (RS256) + session</text><path d="M450,568 L155,590" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwl)"/><rect x="365" y="590" width="170" height="60" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="1.6"/><text x="450" y="615" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="700">ต้องยืนยันเพิ่ม (mfa)</text><text x="450" y="634" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">Step-up — ดูรูปที่ 3.17</text><path d="M450,568 L450,590" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwl)"/><rect x="660" y="590" width="170" height="60" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.6"/><text x="745" y="615" font-size="11" fill="#1E293B" text-anchor="middle" font-weight="700">ปฏิเสธ (block)</text><text x="745" y="634" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">บันทึก audit log</text><path d="M450,568 L745,590" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwl)"/></svg>