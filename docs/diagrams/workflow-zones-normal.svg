<svg width="680" height="376" viewBox="0 0 680 376" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, 'Segoe UI', 'Sarabun', sans-serif">
<title>Workflow ระบบแยก 3 โซน เคสปกติ นักศึกษาจองห้องหอพัก</title>
<desc>ลำดับงาน 6 ขั้นข้าม 3 โซน: ระบบภายนอก (ผู้ใช้, Google), ระบบหลัก (Hub + ML), ระบบย่อย (หอพัก). คะแนนความเสี่ยงต่ำจึงออก JWT ให้จองห้องได้</desc>
<defs>
<marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L7,3 L0,6 Z" fill="#6b6b6b"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="376" fill="#ffffff"/>
<text x="340" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Workflow แยกตามโซน — เคสปกติ (นักศึกษาจองห้องหอพัก)</text>

<rect x="6" y="44" width="668" height="92" rx="8" fill="rgba(138,143,152,0.08)" stroke="#cccccc"/>
<rect x="6" y="140" width="668" height="100" rx="8" fill="rgba(47,111,235,0.08)" stroke="#cccccc"/>
<rect x="6" y="244" width="668" height="92" rx="8" fill="rgba(15,157,143,0.08)" stroke="#cccccc"/>
<text x="16" y="62" font-size="11.5" font-weight="700" fill="#8a8f98">ระบบภายนอก</text>
<text x="16" y="158" font-size="11.5" font-weight="700" fill="#2f6feb">ระบบหลัก (Hub + ML)</text>
<text x="16" y="262" font-size="11.5" font-weight="700" fill="#0f9d8f">ระบบย่อย</text>

<g stroke="#6b6b6b" stroke-width="1.6" fill="none">
<line x1="200" y1="120" x2="200" y2="276" marker-end="url(#m1)"/>
<path d="M200,276 L300,140" marker-end="url(#m1)"/>
<path d="M330,120 L350,196" marker-end="url(#m1)"/>
<line x1="438" y1="220" x2="462" y2="220" marker-end="url(#m1)"/>
<path d="M540,244 L600,276" marker-end="url(#m1)"/>
</g>

<rect x="150" y="78" width="100" height="42" rx="8" fill="#EEF0F2" stroke="#8a8f98" stroke-width="1.5"/>
<text x="200" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">ผู้ใช้กดเข้าระบบ</text>
<text x="200" y="111" text-anchor="middle" font-size="9.5" fill="#555555">ผ่านเบราว์เซอร์</text>
<circle cx="150" cy="78" r="11" fill="#8a8f98"/><text x="150" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>

<rect x="280" y="78" width="100" height="42" rx="8" fill="#EEF0F2" stroke="#8a8f98" stroke-width="1.5"/>
<text x="330" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">ล็อกอิน Google</text>
<text x="330" y="111" text-anchor="middle" font-size="9.5" fill="#555555">ส่ง code กลับ Hub</text>
<circle cx="280" cy="78" r="11" fill="#8a8f98"/><text x="280" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>

<rect x="288" y="196" width="150" height="48" rx="8" fill="#E6F1FB" stroke="#2f6feb" stroke-width="1.5"/>
<text x="363" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#0C447C">ประเมินความเสี่ยง</text>
<text x="363" y="231" text-anchor="middle" font-size="9.5" fill="#555555">23 features · IForest+SHAP · RBA</text>
<circle cx="288" cy="196" r="11" fill="#2f6feb"/><text x="288" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>

<rect x="462" y="196" width="150" height="48" rx="8" fill="#E4F5EA" stroke="#1a9d4f" stroke-width="1.5"/>
<text x="537" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#0b5128">ปกติ → ออก JWT</text>
<text x="537" y="231" text-anchor="middle" font-size="9.5" fill="#555555">+ บันทึก Audit / Dashboard</text>
<circle cx="462" cy="196" r="11" fill="#2f6feb"/><text x="462" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text>

<rect x="150" y="280" width="100" height="42" rx="8" fill="#DDF3F0" stroke="#0f9d8f" stroke-width="1.5"/>
<text x="200" y="298" text-anchor="middle" font-size="11" font-weight="600" fill="#0a5249">หอพัก → Hub</text>
<text x="200" y="313" text-anchor="middle" font-size="9.5" fill="#555555">OAuth + PKCE</text>
<circle cx="150" cy="280" r="11" fill="#0f9d8f"/><text x="150" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>

<rect x="552" y="280" width="110" height="42" rx="8" fill="#DDF3F0" stroke="#0f9d8f" stroke-width="1.5"/>
<text x="607" y="298" text-anchor="middle" font-size="11" font-weight="600" fill="#0a5249">verify JWT</text>
<text x="607" y="313" text-anchor="middle" font-size="9.5" fill="#555555">→ จองห้องได้</text>
<circle cx="552" cy="280" r="11" fill="#0f9d8f"/><text x="552" y="284" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text>

<text x="340" y="356" text-anchor="middle" font-size="10.5" fill="#555555">เส้นทึบ = ลำดับงาน 1→6 · โซนสีบอกว่าแต่ละขั้นเกิดที่ระบบไหน</text>
</svg>
