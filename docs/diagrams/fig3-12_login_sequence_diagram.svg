<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" width="980" height="780" font-family="'Sarabun','TH Sarabun New','Tahoma','Segoe UI','Noto Sans Thai',sans-serif"><rect x="0" y="0" width="980" height="780" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker><marker id="arwl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/></marker><marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker><marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker></defs><text x="490.0" y="30" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">รูปที่ 3.12  แผนภาพลำดับการเข้าสู่ระบบ (Login Sequence Diagram)</text><rect x="35" y="55" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/><text x="110" y="77" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">ผู้ใช้</text><line x1="110" y1="89" x2="110" y2="745" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arwl)"/><rect x="275" y="55" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/><text x="350" y="77" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">ระบบย่อย</text><line x1="350" y1="89" x2="350" y2="745" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arwl)"/><rect x="535" y="55" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/><text x="610" y="77" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">Hub</text><line x1="610" y1="89" x2="610" y2="745" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arwl)"/><rect x="785" y="55" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/><text x="860" y="77" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">Google</text><line x1="860" y1="89" x2="860" y2="745" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arwl)"/><line x1="110" y1="115" x2="350" y2="115" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/><text x="230.0" y="109" font-size="9.8" fill="#1E293B" text-anchor="middle" font-weight="400">1. คลิก “เข้าสู่ระบบ”</text><line x1="350" y1="155" x2="610" y2="155" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/><text x="480.0" y="149" font-size="9.8" fill="#1E293B" text-anchor="middle" font-weight="400">2. GET /oauth/authorize (PKCE challenge)</text><line x1="610" y1="195" x2="860" y2="195" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/><text x="735.0" y="189" font-size="9.8" fill="#1E293B" text-anchor="middle" font-weight="400">3. redirect → IdP (hub_state)</text><line x1="110" y1="235" x2="860" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/><text x="485.0" y="229" font-size="9.8" fill="#1E293B" text-anchor="middle" font-weight="400">4. เลือกบัญชี / ยืนยันตัวตนกับ IdP</text><line x1="860" y1="275" x2="610" y2="275" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/><text x="735.0" y="269" font-size="9.8" fill="#1E293B" text-anchor="middle" font-weight="400">5. callback + id_token</text><rect x="560" y="301" width="240" height="46" rx="8" fill="#E6F6FE" stroke="#0EA5E9" stroke-width="1.6"/><text x="680" y="317" font-size="9.8" fill="#1E293B" text-anchor="middle" font-weight="700">6. ตรวจ access_list + สกัด</text><text x="680" y="333" font-size="9.3" fill="#1E293B" text-anchor="middle" font-weight="700">feature 23 → Hybrid RBA (รูปที่ 3.14)</text><rect x="60" y="375" width="800" height="355" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/><polygon points="60,375 130,375 145,393 60,393" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/><text x="70" y="388" font-size="10" fill="#1E293B" text-anchor="start" font-weight="700">alt</text><text x="360" y="388" font-size="9.8" fill="#475569" text-anchor="start" font-weight="400">[ผลการประเมินความเสี่ยงจาก Hybrid RBA]</text><text x="75" y="409" font-size="9.8" fill="#059669" text-anchor="start" font-weight="700">[allow]  risk &lt; 0.50</text><line x1="610" y1="429" x2="350" y2="429" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/><text x="480.0" y="423" font-size="9.8" fill="#1E293B" text-anchor="middle" font-weight="400">auth_code → แลก JWT (RS256) → session cookie</text><line x1="350" y1="455" x2="110" y2="455" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/><text x="230.0" y="449" font-size="9.8" fill="#1E293B" text-anchor="middle" font-weight="400">แสดงหน้าแรกของระบบย่อย</text><line x1="60" y1="473" x2="860" y2="473" stroke="#94A3B8" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#None)"/><text x="75" y="489" font-size="9.8" fill="#D97706" text-anchor="start" font-weight="700">[mfa]  0.50 ≤ risk &lt; 0.85</text><line x1="610" y1="509" x2="110" y2="509" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arw)"/><text x="360.0" y="503" font-size="9.8" fill="#1E293B" text-anchor="middle" font-weight="400">redirect → /auth/passkey/risk-stepup (รูปที่ 3.17)</text><text x="480" y="535" font-size="9.3" fill="#64748B" text-anchor="middle" font-weight="400">หลังยืนยันสำเร็จ → กลับเข้าเส้นทาง [allow] ด้านบน</text><line x1="60" y1="551" x2="860" y2="551" stroke="#94A3B8" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#None)"/><text x="75" y="567" font-size="9.8" fill="#DC2626" text-anchor="start" font-weight="700">[block]  risk ≥ 0.85</text><line x1="610" y1="587" x2="110" y2="587" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arw)"/><text x="360.0" y="581" font-size="9.8" fill="#1E293B" text-anchor="middle" font-weight="400">หน้าปฏิเสธ + บันทึก audit log (oauth_login_failed_high_risk)</text></svg>