<svg width="680" height="440" viewBox="0 0 680 440" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Segoe UI','Sarabun',sans-serif">
<title>RBAC Permission Checking 3 ชั้น</title>
<defs>
<marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b6b6b"/></marker>
<marker id="cr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d14b3d"/></marker>
</defs>
<rect width="680" height="440" fill="#fff"/>
<text x="340" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">การตรวจสอบสิทธิ์ (RBAC) 3 ชั้น</text>

<!-- input -->
<rect x="240" y="34" width="200" height="32" rx="8" fill="#EEF0F2" stroke="#8a8f98" stroke-width="1.5"/>
<text x="340" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Request + JWT Token</text>
<line x1="340" y1="66" x2="340" y2="84" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#c)"/>

<!-- LAYER 1 -->
<rect x="120" y="86" width="380" height="52" rx="8" fill="#E6F1FB" stroke="#2f6feb" stroke-width="1.5"/>
<text x="340" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#0C447C">ชั้น 1 — Authentication (get_current_user)</text>
<text x="340" y="122" text-anchor="middle" font-size="9.5" fill="#555">verify JWT (RS256 + aud=hub.internal) · เช็ค user.status = active</text>
<line x1="500" y1="112" x2="560" y2="112" stroke="#d14b3d" stroke-width="1.3" marker-end="url(#cr)"/>
<rect x="562" y="100" width="104" height="24" rx="5" fill="#FBE9E7" stroke="#d14b3d"/>
<text x="614" y="116" text-anchor="middle" font-size="9.5" fill="#7a241b">401 Unauthorized</text>
<line x1="340" y1="138" x2="340" y2="156" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#c)"/>
<text x="350" y="150" font-size="9" fill="#1a9d4f">✓ ผ่าน</text>

<!-- LAYER 2 -->
<rect x="120" y="158" width="380" height="68" rx="8" fill="#E6F1FB" stroke="#2f6feb" stroke-width="1.5"/>
<text x="340" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#0C447C">ชั้น 2 — Role Guard (Depends)</text>
<!-- sub boxes -->
<rect x="132" y="184" width="160" height="34" rx="5" fill="#fff" stroke="#2f6feb"/>
<text x="212" y="199" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0C447C">require_hub_admin</text>
<text x="212" y="212" text-anchor="middle" font-size="9" fill="#555">is_hub_admin = True</text>
<rect x="308" y="184" width="180" height="34" rx="5" fill="#fff" stroke="#2f6feb"/>
<text x="398" y="199" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0C447C">require_developer</text>
<text x="398" y="212" text-anchor="middle" font-size="9" fill="#555">teacher / staff / admin เท่านั้น</text>
<line x1="500" y1="192" x2="560" y2="192" stroke="#d14b3d" stroke-width="1.3" marker-end="url(#cr)"/>
<rect x="562" y="180" width="104" height="24" rx="5" fill="#FBE9E7" stroke="#d14b3d"/>
<text x="614" y="196" text-anchor="middle" font-size="9.5" fill="#7a241b">403 Forbidden</text>
<line x1="340" y1="226" x2="340" y2="244" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#c)"/>
<text x="350" y="238" font-size="9" fill="#1a9d4f">✓ ผ่าน</text>

<!-- LAYER 3 -->
<rect x="120" y="246" width="380" height="64" rx="8" fill="#E6F1FB" stroke="#2f6feb" stroke-width="1.5"/>
<text x="340" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#0C447C">ชั้น 3 — Resource Permission (access_list)</text>
<text x="340" y="281" text-anchor="middle" font-size="9.5" fill="#555">เช็ค whitelist ต่อระบบย่อย (subsystem_id + user_id)</text>
<text x="340" y="296" text-anchor="middle" font-size="9.5" fill="#555">revoked_at IS NULL → ยังมีสิทธิ์อยู่ (soft delete เมื่อถอนสิทธิ์)</text>
<line x1="500" y1="272" x2="560" y2="272" stroke="#d14b3d" stroke-width="1.3" marker-end="url(#cr)"/>
<rect x="562" y="260" width="104" height="24" rx="5" fill="#FBE9E7" stroke="#d14b3d"/>
<text x="614" y="276" text-anchor="middle" font-size="9.5" fill="#7a241b">403 ไม่มีสิทธิ์</text>
<line x1="340" y1="310" x2="340" y2="328" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#c)"/>
<text x="350" y="322" font-size="9" fill="#1a9d4f">✓ ผ่าน</text>

<!-- output -->
<rect x="190" y="330" width="300" height="36" rx="8" fill="#E4F5EA" stroke="#1a9d4f" stroke-width="1.5"/>
<text x="340" y="347" text-anchor="middle" font-size="11" font-weight="600" fill="#0b5128">ออก JWT พร้อม role_in_subsystem</text>
<text x="340" y="361" text-anchor="middle" font-size="9.5" fill="#555">เช่น resident · librarian · staff</text>

<!-- permission table -->
<rect x="30" y="380" width="620" height="52" rx="8" fill="#f4f6f8" stroke="#cccccc"/>
<text x="340" y="396" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">สรุปสิทธิ์ตาม user_type</text>
<!-- headers -->
<text x="100" y="412" text-anchor="middle" font-size="9" fill="#555" font-weight="600">student</text>
<text x="210" y="412" text-anchor="middle" font-size="9" fill="#555" font-weight="600">teacher</text>
<text x="320" y="412" text-anchor="middle" font-size="9" fill="#555" font-weight="600">staff</text>
<text x="430" y="412" text-anchor="middle" font-size="9" fill="#555" font-weight="600">admin</text>
<text x="590" y="412" text-anchor="middle" font-size="9" fill="#555" font-weight="600">ทุกคน (ถ้าใน whitelist)</text>
<text x="100" y="425" text-anchor="middle" font-size="9" fill="#d14b3d">❌ Hub login โดยตรง</text>
<text x="210" y="425" text-anchor="middle" font-size="9" fill="#1a9d4f">✓ Developer Portal</text>
<text x="320" y="425" text-anchor="middle" font-size="9" fill="#1a9d4f">✓ Developer Portal</text>
<text x="430" y="425" text-anchor="middle" font-size="9" fill="#1a9d4f">✓ Admin + All</text>
<text x="590" y="425" text-anchor="middle" font-size="9" fill="#1a9d4f">✓ OAuth subsystem flow</text>
</svg>
