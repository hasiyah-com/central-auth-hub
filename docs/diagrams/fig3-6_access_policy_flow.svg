<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" width="960" height="860" font-family="'Sarabun','TH Sarabun New','Tahoma','Segoe UI','Noto Sans Thai',sans-serif"><rect x="0" y="0" width="960" height="860" fill="#FFFFFF"/><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker><marker id="arwl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/></marker><marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker><marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker></defs><text x="480.0" y="30" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">รูปที่ 3.6  กระบวนการควบคุมสิทธิ์การเข้าถึง (Access Policy Flow)</text><rect x="280" y="50" width="400" height="44" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="480" y="77" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">เลือก Access Policy ตอนลงทะเบียน — รูปที่ 3.5</text><line x1="480" y1="94" x2="480" y2="116" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="40" y="118" width="200" height="110" rx="10" fill="#EEF0FF" stroke="#6366F1" stroke-width="1.6"/><text x="140" y="142" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">explicit (default)</text><text x="140" y="162" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">whitelist ใน access_list</text><text x="140" y="178" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">(entry_type=allow,</text><text x="140" y="194" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">revoked_at IS NULL)</text><line x1="140" y1="228" x2="480" y2="260" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="270" y="118" width="200" height="110" rx="10" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="370" y="142" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">all</text><text x="370" y="162" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">ทุก user ที่</text><text x="370" y="178" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">status = active</text><text x="370" y="194" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">เข้าได้หมด</text><line x1="370" y1="228" x2="480" y2="260" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="500" y="118" width="200" height="110" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="1.6"/><text x="600" y="142" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">role</text><text x="600" y="162" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">user_type ∈</text><text x="600" y="178" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">access_policy_config</text><text x="600" y="194" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">["roles"]</text><line x1="600" y1="228" x2="480" y2="260" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="730" y="118" width="200" height="110" rx="10" fill="#E6F6FE" stroke="#0EA5E9" stroke-width="1.6"/><text x="830" y="142" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">attribute (ABAC)</text><text x="830" y="162" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">match config.faculty /</text><text x="830" y="178" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">config.major กับ</text><text x="830" y="194" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">user.faculty / user.major</text><line x1="830" y1="228" x2="480" y2="260" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="280" y="262" width="400" height="56" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.6"/><text x="480" y="285" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">deny-list ทับทุก policy เสมอ</text><text x="480" y="303" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">(entry_type=deny) — ใช้ ban รายคนจาก all/role/attribute</text><line x1="480" y1="318" x2="480" y2="342" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><rect x="180" y="344" width="600" height="56" rx="10" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.6"/><text x="480" y="368" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">evaluate_access_policy(db, user, subsystem)</text><text x="480" y="386" font-size="10" fill="#475569" text-anchor="middle" font-weight="400">ใช้เกณฑ์เดียวกันทั้ง login-time และ roster sync (single source of truth)</text><polygon points="480,415 590,455 480,495 370,455" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="480" y="452" font-size="10" fill="#1E293B" text-anchor="middle" font-weight="700">① Runtime: login</text><text x="480" y="467" font-size="10" fill="#1E293B" text-anchor="middle" font-weight="700">ผ่าน policy?</text><rect x="150" y="530" width="260" height="60" rx="10" fill="#E7F8F1" stroke="#059669" stroke-width="1.6"/><text x="280" y="555" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">ผ่าน (allowed=True)</text><text x="280" y="574" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">ดำเนินต่อ → Hybrid RBA (รูปที่ 3.14)</text><rect x="550" y="530" width="260" height="60" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.6"/><text x="680" y="555" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">ไม่ผ่าน (allowed=False)</text><text x="680" y="574" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="400">log oauth_login_failed_access_policy</text><path d="M430,495 L280,530" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwg)"/><path d="M530,495 L680,530" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arwr)"/><rect x="110" y="630" width="380" height="74" rx="10" fill="#E6F6FE" stroke="#0EA5E9" stroke-width="1.6"/><text x="300" y="656" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">② Roster Sync (S2S, pull)</text><text x="300" y="676" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">subsystem → GET /api/v1/roster</text><text x="300" y="693" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">(X-Api-Key) ดึงล่วงหน้าก่อน user login</text><rect x="530" y="630" width="320" height="74" rx="10" fill="#FEF3E2" stroke="#D97706" stroke-width="1.6"/><text x="690" y="656" font-size="11.5" fill="#1E293B" text-anchor="middle" font-weight="700">③ เพิกถอนสิทธิ์ (explicit)</text><text x="690" y="676" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">DELETE .../whitelist/{user_id}</text><text x="690" y="693" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="400">→ soft delete revoked_at=NOW()</text><line x1="280" y1="590" x2="300" y2="630" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arwl)"/><path d="M680,590 C 680,615 690,615 690,630" stroke="#475569" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arwl)"/><text x="480.0" y="726" font-size="10" fill="#DC2626" text-anchor="middle" font-weight="400">หมายเหตุ: เพิกถอนมีผลตั้งแต่ login/roster pull ครั้งถัดไป (ไม่ revoke JWT ที่ออกไปแล้วทันที)</text></svg>