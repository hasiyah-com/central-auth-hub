<svg width="680" height="430" viewBox="0 0 680 430" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,'Segoe UI','Sarabun',sans-serif">
<title>Authentication Flow: Google OAuth และ Passkey (WebAuthn)</title>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b6b6b"/></marker></defs>
<rect width="680" height="430" fill="#fff"/>
<text x="340" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">กระบวนการยืนยันตัวตน (Authentication Flow)</text>
<rect x="10" y="32" width="130" height="26" rx="6" fill="#EEF0F2" stroke="#8a8f98"/>
<text x="75" y="49" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">ผู้ใช้ / เบราว์เซอร์</text>
<rect x="150" y="32" width="130" height="26" rx="6" fill="#DDF3F0" stroke="#0f9d8f"/>
<text x="215" y="49" text-anchor="middle" font-size="11" font-weight="600" fill="#0a5249">ระบบย่อย</text>
<rect x="290" y="32" width="200" height="26" rx="6" fill="#E6F1FB" stroke="#2f6feb"/>
<text x="390" y="49" text-anchor="middle" font-size="11" font-weight="600" fill="#0C447C">Hub (Central Auth)</text>
<rect x="500" y="32" width="170" height="26" rx="6" fill="#EEF0F2" stroke="#8a8f98"/>
<text x="585" y="49" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">Google OAuth / Device</text>
<line x1="75" y1="58" x2="75" y2="405" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="215" y1="58" x2="215" y2="405" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="390" y1="58" x2="390" y2="405" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="585" y1="58" x2="585" y2="405" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="14" y="62" width="120" height="24" rx="5" fill="#E6F1FB" stroke="#2f6feb"/>
<text x="74" y="78" text-anchor="middle" font-size="10">① กดเข้าระบบหอพัก</text>
<line x1="74" y1="86" x2="215" y2="86" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#b)"/>
<rect x="154" y="92" width="120" height="24" rx="5" fill="#DDF3F0" stroke="#0f9d8f"/>
<text x="214" y="108" text-anchor="middle" font-size="10">② redirect → Hub</text>
<line x1="284" y1="104" x2="390" y2="104" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#b)"/>
<text x="30" y="132" font-size="9.5" font-weight="700" fill="#2f6feb">— วิธีที่ 1: Google OAuth —</text>
<rect x="294" y="134" width="190" height="24" rx="5" fill="#E6F1FB" stroke="#2f6feb"/>
<text x="389" y="150" text-anchor="middle" font-size="10">③ Hub redirect → Google (PKCE)</text>
<line x1="484" y1="146" x2="500" y2="146" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#b)"/>
<rect x="504" y="134" width="162" height="24" rx="5" fill="#EEF0F2" stroke="#8a8f98"/>
<text x="585" y="150" text-anchor="middle" font-size="10">④ ผู้ใช้เลือก Google account</text>
<line x1="504" y1="162" x2="484" y2="162" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#b)"/>
<rect x="294" y="168" width="190" height="24" rx="5" fill="#E6F1FB" stroke="#2f6feb"/>
<text x="389" y="184" text-anchor="middle" font-size="10">⑤ Hub verify code → ได้ email</text>
<line x1="389" y1="192" x2="389" y2="208" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#b)"/>
<text x="30" y="218" font-size="9.5" font-weight="700" fill="#2f6feb">— วิธีที่ 2: Passkey (WebAuthn) —</text>
<rect x="14" y="222" width="120" height="24" rx="5" fill="#E6F1FB" stroke="#2f6feb"/>
<text x="74" y="238" text-anchor="middle" font-size="10">① กด "เข้าด้วย Passkey"</text>
<line x1="134" y1="234" x2="390" y2="234" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#b)"/>
<rect x="294" y="244" width="190" height="24" rx="5" fill="#E6F1FB" stroke="#2f6feb"/>
<text x="389" y="260" text-anchor="middle" font-size="10">② Hub ส่ง challenge (FIDO2)</text>
<line x1="390" y1="268" x2="74" y2="268" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#b)"/>
<rect x="14" y="274" width="120" height="24" rx="5" fill="#EEF0F2" stroke="#8a8f98"/>
<text x="74" y="290" text-anchor="middle" font-size="10">③ Face ID / Touch / PIN</text>
<line x1="134" y1="286" x2="500" y2="286" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#b)"/>
<rect x="504" y="274" width="162" height="24" rx="5" fill="#EEF0F2" stroke="#8a8f98"/>
<text x="585" y="290" text-anchor="middle" font-size="10">④ Device sign response</text>
<line x1="504" y1="294" x2="484" y2="294" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#b)"/>
<rect x="294" y="300" width="190" height="24" rx="5" fill="#E6F1FB" stroke="#2f6feb"/>
<text x="389" y="316" text-anchor="middle" font-size="10">⑤ Hub verify signature</text>
<line x1="389" y1="324" x2="389" y2="334" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#b)"/>
<rect x="220" y="336" width="340" height="28" rx="6" fill="#E6F1FB" stroke="#2f6feb" stroke-width="1.5"/>
<text x="390" y="354" text-anchor="middle" font-size="11" font-weight="600" fill="#0C447C">⑥ ตรวจ RBAC + access_list → ประเมินความเสี่ยง ML</text>
<line x1="390" y1="364" x2="390" y2="378" stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#b)"/>
<rect x="220" y="380" width="340" height="24" rx="6" fill="#E4F5EA" stroke="#1a9d4f" stroke-width="1.5"/>
<text x="390" y="396" text-anchor="middle" font-size="11" font-weight="600" fill="#0b5128">⑦ ออก JWT (RS256, aud=client_id) → กลับระบบย่อย</text>
<text x="340" y="422" text-anchor="middle" font-size="9.5" fill="#555">ทั้ง 2 วิธีรวมที่ขั้น ⑥ เหมือนกัน — Hub ไม่ต้องรู้ว่า user login ด้วยวิธีไหน</text>
</svg>
