<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">5 กฎ api_guard — เงื่อนไขการตรวจจับ</title>
  <desc id="desc">แสดง flow ของ rule 1-5: แหล่งข้อมูล, group by, เงื่อนไข, window, severity, และผลลัพธ์</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .lbl { font-size: 11px; fill: #64748b; }
      .ttl { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 11px; fill: #334155; }
      .cond { font-size: 11px; fill: #0f172a; font-family: ui-monospace, monospace; }
      .badge { font-size: 10px; font-weight: 700; }
      .src { font-size: 10px; fill: #64748b; font-family: ui-monospace, monospace; }
    </style>
  </defs>

  <rect width="1100" height="780" fill="#ffffff"/>

  <text x="20" y="28" class="ttl" font-size="16">api_guard — 5 rules ตรวจจับพฤติกรรมผิดปกติ</text>
  <text x="20" y="48" class="sub">scheduler รันทุก 5 นาที · เจอ pattern → สร้าง ApiAlert + ส่ง webhook/email · dedup 10 นาที (rule+ip+user_id)</text>

  <rect x="60" y="80" width="280" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="200" y="100" text-anchor="middle" class="ttl">request_logs</text>
  <text x="200" y="118" text-anchor="middle" class="src">method · path · status · ip · user · ua</text>

  <rect x="760" y="80" width="280" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="900" y="100" text-anchor="middle" class="ttl">audit_logs</text>
  <text x="900" y="118" text-anchor="middle" class="src">actor · action · target · ip · metadata</text>

  <text x="200" y="148" text-anchor="middle" class="lbl">จัดกลุ่มตาม IP</text>
  <text x="900" y="148" text-anchor="middle" class="lbl">จัดกลุ่มตาม actor (user_id)</text>

  <g>
    <rect x="40" y="180" width="220" height="155" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="40" y="180" width="220" height="28" rx="10" fill="#fef3c7"/>
    <text x="55" y="199" class="ttl" fill="#854d0e">1 · excessive_requests</text>
    <rect x="200" y="186" width="48" height="16" rx="8" fill="#fef9c3"/>
    <text x="224" y="198" text-anchor="middle" class="badge" fill="#854d0e">warn</text>
    <text x="55" y="226" class="sub">เงื่อนไข</text>
    <text x="55" y="244" class="cond">count(req) &gt; 100</text>
    <text x="55" y="262" class="cond">window: 60s</text>
    <text x="55" y="285" class="sub">จับ:</text>
    <text x="55" y="302" class="sub">DoS · scraper · spam</text>
    <text x="55" y="320" class="lbl">— ทุก status รวมกัน —</text>
  </g>

  <g>
    <rect x="280" y="180" width="220" height="155" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="280" y="180" width="220" height="28" rx="10" fill="#fef3c7"/>
    <text x="295" y="199" class="ttl" fill="#854d0e">2 · high_error_rate</text>
    <rect x="440" y="186" width="48" height="16" rx="8" fill="#fef9c3"/>
    <text x="464" y="198" text-anchor="middle" class="badge" fill="#854d0e">warn</text>
    <text x="295" y="226" class="sub">เงื่อนไข</text>
    <text x="295" y="244" class="cond">count(4xx) &gt; 20</text>
    <text x="295" y="262" class="cond">window: 5 min</text>
    <text x="295" y="285" class="sub">จับ:</text>
    <text x="295" y="302" class="sub">fuzz endpoint · broken</text>
    <text x="295" y="320" class="lbl">— 400 ≤ status &lt; 500 —</text>
  </g>

  <g>
    <rect x="520" y="180" width="220" height="155" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="520" y="180" width="220" height="28" rx="10" fill="#fee2e2"/>
    <text x="535" y="199" class="ttl" fill="#991b1b">3 · unauthorized_probing ⭐</text>
    <rect x="680" y="186" width="48" height="16" rx="8" fill="#fecaca"/>
    <text x="704" y="198" text-anchor="middle" class="badge" fill="#991b1b">crit</text>
    <text x="535" y="226" class="sub">เงื่อนไข</text>
    <text x="535" y="244" class="cond">count(403) &gt; 5</text>
    <text x="535" y="262" class="cond">window: 5 min</text>
    <text x="535" y="285" class="sub">จับ:</text>
    <text x="535" y="302" class="sub">privilege escalation</text>
    <text x="535" y="320" class="lbl">— ระบบบอก "ห้าม" แล้วยังพยายาม —</text>
  </g>

  <g>
    <rect x="40" y="360" width="460" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="40" y="360" width="460" height="28" rx="10" fill="#fef3c7"/>
    <text x="55" y="379" class="ttl" fill="#854d0e">4 · bot_pattern (interval analysis)</text>
    <rect x="440" y="366" width="48" height="16" rx="8" fill="#fef9c3"/>
    <text x="464" y="378" text-anchor="middle" class="badge" fill="#854d0e">warn</text>
    <text x="55" y="406" class="sub">เงื่อนไข (สองข้อพร้อมกัน)</text>
    <text x="55" y="424" class="cond">count(req) ≥ 10  AND  CV(intervals) &lt; 0.15</text>
    <text x="55" y="442" class="cond">window: 2 min · CV = stdev / mean</text>
    <text x="55" y="464" class="sub">จับ: คนเขียน bot delay คงที่ (มนุษย์ interval ไม่สม่ำเสมอ)</text>
  </g>

  <g>
    <rect x="760" y="180" width="300" height="300" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="760" y="180" width="300" height="28" rx="10" fill="#ede9fe"/>
    <text x="775" y="199" class="ttl" fill="#5b21b6">5 · repeated_failed_mutation ⭐ ใหม่</text>
    <rect x="1000" y="186" width="48" height="16" rx="8" fill="#ddd6fe"/>
    <text x="1024" y="198" text-anchor="middle" class="badge" fill="#5b21b6">warn</text>

    <text x="775" y="226" class="sub">เงื่อนไข</text>
    <text x="775" y="244" class="cond">count(action) &gt; 10</text>
    <text x="775" y="262" class="cond">window: 5 min · per actor</text>

    <text x="775" y="288" class="sub">action LIKE</text>
    <text x="775" y="306" class="cond">%_failed</text>
    <text x="775" y="322" class="cond">%_denied</text>
    <text x="775" y="338" class="cond">%_blocked%</text>

    <text x="775" y="364" class="sub">จับ:</text>
    <text x="775" y="382" class="sub">IDOR · enumeration · spam mutation</text>

    <text x="775" y="412" class="lbl">ตัวอย่าง action ที่ครอบ:</text>
    <text x="775" y="428" class="src">subsystem_access_denied</text>
    <text x="775" y="444" class="src">delete_user_failed</text>
    <text x="775" y="460" class="src">whitelist_add_failed · mfa_verify_failed</text>
    <text x="775" y="476" class="src">user_access_denied · …</text>
  </g>

  <line x1="200" y1="155" x2="200" y2="178" stroke="#64748b" marker-end="url(#arr)"/>
  <line x1="200" y1="155" x2="390" y2="178" stroke="#64748b" marker-end="url(#arr)"/>
  <line x1="200" y1="155" x2="630" y2="178" stroke="#64748b" marker-end="url(#arr)"/>
  <line x1="200" y1="155" x2="270" y2="358" stroke="#64748b" marker-end="url(#arr)"/>
  <line x1="900" y1="155" x2="900" y2="178" stroke="#7c3aed" marker-end="url(#arr)"/>

  <rect x="60" y="520" width="980" height="100" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="80" y="545" class="ttl">Pipeline เดียวกันทั้ง 5 rules</text>

  <rect x="80" y="560" width="200" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="180" y="580" text-anchor="middle" class="sub">scheduler รัน 5 นาที/ครั้ง</text>
  <text x="180" y="598" text-anchor="middle" class="lbl">หรือ POST /admin/api-alerts/scan</text>

  <rect x="310" y="560" width="200" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="410" y="580" text-anchor="middle" class="sub">scan_request_logs()</text>
  <text x="410" y="598" text-anchor="middle" class="lbl">ตรวจทั้ง 5 rules — คืน alert list</text>

  <rect x="540" y="560" width="200" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="640" y="580" text-anchor="middle" class="sub">dedup (10 นาที)</text>
  <text x="640" y="598" text-anchor="middle" class="lbl">key = rule + ip + user_id</text>

  <rect x="770" y="560" width="240" height="48" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="890" y="580" text-anchor="middle" class="sub" fill="#854d0e">persist ApiAlert + send_alert()</text>
  <text x="890" y="598" text-anchor="middle" class="lbl" fill="#854d0e">→ Telegram / email / webhook</text>

  <line x1="280" y1="584" x2="308" y2="584" stroke="#64748b" marker-end="url(#arr)"/>
  <line x1="510" y1="584" x2="538" y2="584" stroke="#64748b" marker-end="url(#arr)"/>
  <line x1="740" y1="584" x2="768" y2="584" stroke="#64748b" marker-end="url(#arr)"/>

  <rect x="60" y="650" width="980" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="675" class="ttl">เปรียบเทียบ: IP-based (1-4) vs Actor-based (5)</text>

  <rect x="80" y="690" width="14" height="14" rx="3" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="100" y="702" class="sub">Rule 1-4 · per IP · request_logs · HTTP level</text>
  <text x="100" y="720" class="lbl">จับ: rate / 4xx / 403 / bot interval — มอง response status</text>

  <rect x="560" y="690" width="14" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="580" y="702" class="sub">Rule 5 · per actor · audit_logs · Business level</text>
  <text x="580" y="720" class="lbl">จับ: failure-path log (เจตนา) — HTTP เป็น 404 ปกติก็จับได้</text>

  <text x="80" y="745" class="lbl">→ complementary ไม่ซ้ำซ้อน · rule 5 เห็นสิ่งที่ 1-4 มองข้าม (เช่น IDOR เดา user_id ที่ตอบ 404 ตลอด)</text>
</svg>
