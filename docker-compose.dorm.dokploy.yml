# Subsystem A — ระบบหอพัก (Dorm) — DOKPLOY deployment (DB แยกเป็น Dokploy resource)
# ─────────────────────────────────────────────────────────────────────────────
# Compose นี้มี "เฉพาะ app" — PostgreSQL สร้างเป็น Dokploy Database resource แยก
# (แบบเดียวกับ Hub) → data อยู่รอด redeploy + Dokploy backup ให้
#
# ═══ §A. สร้าง Database ก่อน ═══════════════════════════════════════════════════
# Dokploy → Create Service → Database → PostgreSQL (v15) → ตั้ง user/pass/db
#   → หลังสร้างได้ "Internal Host" เช่น  <project>-dorm-postgres-xxxx
#
# ═══ §B. Environment ที่ต้องตั้งใน Dokploy UI (ของ compose นี้) ═════════════════
#   APP_ENV=production
#   SESSION_SECRET_KEY=<random 64 chars>       SESSION_COOKIE_SECURE=true
#   DATABASE_URL=postgresql+psycopg2://<user>:<pass>@<dorm-pg-internal-host>:5432/<db>
#   DORM_CLIENT_ID / DORM_CLIENT_SECRET        (ได้จากลงทะเบียนกับ Hub /developer)
#   HUB_INTERNAL_URL=https://<hub-domain>      HUB_PUBLIC_URL=https://<hub-domain>
#   DORM_CALLBACK_URL=https://<dorm-domain>/oauth/callback   (register กับ Hub ให้ตรง)
#   HUB_WEBHOOK_SHARED_KEY=<ตรงกับ Hub>        SESSION_COOKIE_NAME=dorm_session
#
# ═══ §C. Domain (Dokploy → Traefik ออก TLS) ═══════════════════════════════════
#   subsystem-dorm → https://<dorm-domain>   port 8000
#
# ⚠️ ตั้ง Compose Path ใน Dokploy = docker-compose.dorm.dokploy.yml (ไม่ใช่ .prod.yml)
# หมายเหตุ: schema สร้างอัตโนมัติตอน startup (create_all) — ไม่ต้อง migration
# seed 24 ห้อง (Dokploy terminal ครั้งเดียว): python -m scripts.seed_rooms

services:
  subsystem-dorm:
    build:
      context: ./hub/subsystem-dorm
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    # env ทั้งหมดจาก Dokploy UI (.env) — รวม DATABASE_URL ที่ชี้ Postgres resource
    env_file:
      - .env
    networks:
      # อยู่บน dokploy-network → เข้าถึง Postgres resource + ให้ Traefik route เข้ามา
      - dokploy-network
    # --proxy-headers อ่าน X-Forwarded-For จาก Dokploy proxy ถูก (get_client_ip)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'

networks:
  dokploy-network:
    external: true
