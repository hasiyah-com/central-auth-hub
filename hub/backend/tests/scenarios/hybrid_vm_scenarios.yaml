# ชุดสถานการณ์ทดสอบใน VM แบบมี label — Hybrid RBA 4 Layers (ระยะที่ 3, 2026-09-23)
#
# ตรวจด้วย hub/backend/tests/test_vm_scenarios.py · โหลดด้วย scripts/vm_scenarios.py
# บัญชีทดสอบ vm-*@example.test เท่านั้น · ทดสอบเฉพาะระบบในเครื่อง ห้ามส่ง traffic ออกนอก
#
# features = ค่าที่เปลี่ยนทับบนเวกเตอร์ปกติของผู้ใช้ทดสอบ (ชื่อตาม rule_engine.FEAT)
# expected_minimum_action / expected_maximum_action = ความคาดหวังของฝ่ายความปลอดภัย
#   ไม่ใช่ผลของระบบ — ถ้าระบบไม่ถึง ถือเป็นข้อค้นพบที่ต้องรายงาน
# label มาจากการสร้าง (labeled by construction) ไม่ใช่การโจมตีจริง

scenarios:
  # ── กลุ่มปกติ ──────────────────────────────────────────────────────────────
  - scenario_id: VM-N01
    label: normal
    severity: none
    attack_family: none
    user_id: vm-student-01
    subsystem_id: sub-dorm
    start_time: 2026-09-23T02:00:00Z
    end_time: 2026-09-23T02:05:00Z
    expected_minimum_action: allow
    expected_maximum_action: allow
    expected_reason: อุปกรณ์ ตำแหน่ง และเวลาเดิม
    seed: 9001
    description: อุปกรณ์เดิม ตำแหน่งเดิม เวลาเดิม
    events:
      - at: 2026-09-23T02:00:00Z
        features: {}

  - scenario_id: VM-N02
    label: normal
    severity: none
    attack_family: none
    user_id: vm-student-01
    subsystem_id: sub-dorm
    start_time: 2026-09-23T04:00:00Z
    end_time: 2026-09-23T04:05:00Z
    expected_minimum_action: allow
    expected_maximum_action: warn
    expected_reason: เวลาเลื่อนเล็กน้อยจากปกติ
    seed: 9002
    description: อุปกรณ์เดิม แต่เวลาเปลี่ยนเล็กน้อย (~1.5 ชม.)
    events:
      - at: 2026-09-23T04:00:00Z
        features: {hours_from_typical_login_time: 1.5}

  - scenario_id: VM-N03
    label: normal
    severity: none
    attack_family: none
    user_id: vm-teacher-01
    subsystem_id: sub-library
    start_time: 2026-09-23T03:00:00Z
    end_time: 2026-09-23T03:05:00Z
    expected_minimum_action: allow
    expected_maximum_action: allow
    expected_reason: ระบบย่อยที่ผู้ใช้เคยเข้า
    seed: 9003
    description: เข้าระบบย่อยที่ใช้ประจำ
    events:
      - at: 2026-09-23T03:00:00Z
        features: {}

  - scenario_id: VM-N04
    label: normal
    severity: none
    attack_family: none
    user_id: vm-teacher-01
    subsystem_id: sub-library
    start_time: 2026-09-23T05:00:00Z
    end_time: 2026-09-23T05:05:00Z
    expected_minimum_action: allow
    expected_maximum_action: warn
    expected_reason: กลับมาใช้หลังหายไป ~20 วัน
    seed: 9004
    description: Login หลังไม่ได้ใช้งานช่วงหนึ่ง
    events:
      - at: 2026-09-23T05:00:00Z
        features: {log_minutes_since_last_login: 10.27, login_count_24h: 1}

  - scenario_id: VM-N05
    label: normal
    severity: none
    attack_family: none
    user_id: vm-staff-01
    subsystem_id: sub-dorm
    start_time: 2026-09-23T06:00:00Z
    end_time: 2026-09-23T06:05:00Z
    expected_minimum_action: allow
    expected_maximum_action: warn
    expected_reason: เปลี่ยนเบราว์เซอร์บนเครื่องเดิม
    seed: 9005
    description: เปลี่ยนเบราว์เซอร์ตามปกติ (UA family ใหม่ อุปกรณ์เดิม)
    events:
      - at: 2026-09-23T06:00:00Z
        features: {is_new_user_agent_family: 1}

  # ── กลุ่มโจมตีชัดเจน ──────────────────────────────────────────────────────────
