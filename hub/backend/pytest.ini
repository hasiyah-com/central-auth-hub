[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    smoke: smoke tests (fast, no DB writes)
    integration: integration tests (real DB)
    slow: slow tests (skip via -m 'not slow')
    performance: latency/throughput — Performance Gate แยกจาก Functional Gate (TEST_GATE=performance)
filterwarnings =
    ignore::DeprecationWarning:jose.*
    ignore::DeprecationWarning:passlib.*
