[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "central-auth-hub"
version = "0.1.0"
description = "Official Python SDK for Central Auth Hub — OAuth 2.0 + PKCE + JWT verification in ~10 lines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Central Auth Hub Team" }
]
keywords = ["oauth2", "oidc", "jwt", "pkce", "authentication"]
dependencies = [
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
