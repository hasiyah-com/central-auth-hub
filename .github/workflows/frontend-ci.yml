name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "hub/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "hub/frontend/**"

jobs:
  jest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Jest (React Testing Library)
        run: npm test
