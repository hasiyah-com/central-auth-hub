# Shared reverse-proxy headers — included ใน location ที่ proxy_pass ไป upstream
#
# X-Forwarded-For/Proto สำคัญมาก:
#   - app/deps.py get_client_ip() อ่าน X-Forwarded-For → audit log + GeoIP + rate-limit เห็น IP จริง
#   - uvicorn --proxy-headers อ่าน X-Forwarded-Proto=https → cookie Secure + redirect URL ถูก scheme

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# WebSocket / upgrade (เผื่อ Next.js + future use)
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# HSTS ออกจาก edge เท่านั้น — ลบของ backend (hub app set เองตอน production) กัน header ซ้ำ
proxy_hide_header Strict-Transport-Security;

# whitelist CSV upload (developer portal) — เผื่อไฟล์ใหญ่
client_max_body_size 10m;

proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
