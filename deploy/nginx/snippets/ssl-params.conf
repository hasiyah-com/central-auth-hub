# Shared TLS hardening — included ใน server{} ของทุก subdomain (HTTPS)
# Mozilla "intermediate" profile (TLS 1.2 + 1.3)

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;
ssl_session_tickets off;

# OCSP stapling (LE fullchain มี chain ครบ)
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# HSTS — set ที่ edge (authoritative). proxy-params strip ของ backend ออกกัน header ซ้ำ
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# กัน fingerprint nginx version
server_tokens off;
